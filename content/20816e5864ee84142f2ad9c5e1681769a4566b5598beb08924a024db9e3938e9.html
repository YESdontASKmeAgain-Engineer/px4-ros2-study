ex('executors','用一个慢回调观察单线程阻塞',ROS,'只创建计时节点，不连接飞控。',[shStep('运行单线程实验',rosCode(pythonCode(`import time,rclpy

state={'last':time.monotonic(),'count':0}
def fast():
    now=time.monotonic(); print('gap',round(now-state['last'],3),flush=True)
    state.update(last=now,count=state['count']+1)
def slow(): time.sleep(0.4)
t1=n.create_timer(0.1,fast); t2=n.create_timer(0.5,slow)
end=time.monotonic()+2
while time.monotonic()<end: rclpy.spin_once(n,timeout_sec=0.1)
n.destroy_node(); rclpy.shutdown()`)),'多数 gap 接近0.1，慢回调发生后会出现约0.4秒或更长间隔。')],[['换多线程后仍阻塞','还要考虑 Callback Group 互斥以及 Python 运算的 GIL。'],['如何用于工程','把耗时工作放到独立线程/进程，用有界队列交换结果并测实际周期。']],'约2秒后自动退出。');

ex('timesync','测量 IMU 到达间隔与时间戳差值',ROS,'MAVROS 已持续发布 IMU；下面创建只读订阅者，运行最多8秒。',[shStep('收集50个样本',rosCode(pythonCode(`import time,statistics,rclpy
from sensor_msgs.msg import Imu
from rclpy.qos import qos_profile_sensor_data
rclpy.init(); n=rclpy.create_node('imu_timing_example')
times=[]; ages=[]
def cb(msg):
    times.append(time.monotonic())
    ages.append(time.time()-(msg.header.stamp.sec+msg.header.stamp.nanosec*1e-9))
sub=n.create_subscription(Imu,'/mavros/imu/data',cb,qos_profile_sensor_data)
end=time.monotonic()+8
while len(times)<50 and time.monotonic()<end: rclpy.spin_once(n,timeout_sec=0.1)
if len(times)>1:
    gaps=[b-a for a,b in zip(times,times[1:])]
    print('samples',len(times),'mean gap',statistics.mean(gaps),'max gap',max(gaps))
    print('wall-minus-header mean',statistics.mean(ages))
else: print('NO DATA: check MAVROS and topic')

calc('search','运行一个可复制的四邻域 A*',`import heapq

queue=[(h(start),0,start)]; cost={start:0}; parent={}

    _,g,p=heapq.heappop(queue)
    if g!=cost[p]: continue
    if p==goal: break

examples.quaternions.steps.push(shStep('读取一帧实际姿态，转换成角度',rosCode(pythonCode(`import math,time,rclpy
from sensor_msgs.msg import Imu
from rclpy.qos import qos_profile_sensor_data
rclpy.init(); n=rclpy.create_node('attitude_angles_example'); received=[]
def cb(msg): received.append(msg.orientation)
sub=n.create_subscription(Imu,'/mavros/imu/data',cb,qos_profile_sensor_data)
end=time.monotonic()+8
while not received and time.monotonic()<end: rclpy.spin_once(n,timeout_sec=0.1)
if received:
    q=received[-1]; x,y,z,w=q.x,q.y,q.z,q.w
    norm=math.sqrt(x*x+y*y+z*z+w*w)
    if norm<1e-8: print('Invalid zero quaternion')
    else:
        x,y,z,w=[v/norm for v in (x,y,z,w)]
        roll=math.atan2(2*(w*x+y*z),1-2*(x*x+y*y))
        pitch=math.asin(max(-1,min(1,2*(w*y-z*x))))
        yaw=math.atan2(2*(w*z+x*y),1-2*(y*y+z*z))
        print('roll pitch yaw degrees:',*[round(math.degrees(v),2) for v in (roll,pitch,yaw)])
else: print('NO IMU DATA within 8 seconds')
n.destroy_node(); rclpy.shutdown()`)),'打印一组roll/pitch/yaw角度；对应ROS消息的坐标约定，不能直接当作NED航向角。'));

 'sensor_msgs/msg/MagneticField','sensor_msgs/msg/FluidPressure',
 'sensor_msgs/msg/Temperature','sensor_msgs/msg/BatteryState',
 'mavros_msgs/msg/GPSRAW','mavros_msgs/msg/OpticalFlow',
 'mavros_msgs/msg/OpticalFlowRad','mavros_msgs/msg/VfrHud',

from rclpy.qos import qos_profile_sensor_data
NAMES={0:'HEARTBEAT',1:'SYS_STATUS',24:'GPS_RAW_INT',26:'SCALED_IMU',27:'RAW_IMU',
 29:'SCALED_PRESSURE',30:'ATTITUDE',31:'ATTITUDE_QUATERNION',74:'VFR_HUD',
 100:'OPTICAL_FLOW',105:'HIGHRES_IMU',106:'OPTICAL_FLOW_RAD',116:'SCALED_IMU2',
 124:'GPS2_RAW',129:'SCALED_IMU3',132:'DISTANCE_SENSOR',137:'SCALED_PRESSURE2',
 143:'SCALED_PRESSURE3',147:'BATTERY_STATUS',330:'OBSTACLE_DISTANCE',331:'ODOMETRY'}
rclpy.init(); node=rclpy.create_node('incoming_sensor_mavlink_observer')
counts=collections.Counter(); ranges={}; subscriptions=[]
def callback(msg,topic):
    if msg.framing_status!=Mavlink.FRAMING_OK: return
    counts[(topic,msg.sysid,msg.compid,msg.msgid)]+=1
    if msg.msgid==132 and msg.len<=len(msg.payload64)*8:
        payload=b''.join(int(w).to_bytes(8,'little') for w in msg.payload64)[:msg.len]
        # common.xml DISTANCE_SENSOR 基础字段；MAVLink2的尾部零可被截断。
        boot,minimum,maximum,current,kind,sensor_id,orientation,cov=struct.unpack_from('<IHHHBBBB',payload.ljust(14,bytes([0])))
        ranges[(topic,msg.sysid,msg.compid,sensor_id)]=(kind,orientation,current/100,minimum/100,maximum/100)
try:
    end=time.monotonic()+2
    while time.monotonic()<end: rclpy.spin_once(node,timeout_sec=0.1)
    for topic,types in node.get_topic_names_and_types():

            subscriptions.append(node.create_subscription(Mavlink,topic,lambda msg,t=topic:callback(msg,t),qos_profile_sensor_data))

        print('No incoming raw topic. Use ros2 topic find mavros_msgs/msg/Mavlink, then check endpoint direction.')
    else:

 shStep('Linux 主机：观察同一条链路收到的MAVLink消息',rosCode(pythonCode(sensorMavlinkProbe)),'显示发送方system/component、消息名和计数。若出现DISTANCE_SENSOR，还会显示sensor_id、type、orientation和米制距离。先用topic info -v核对mavlink_source的发布者是router；不同MAVROS架构需按实际路由确认。'),
 shStep('Linux 主机：核对插件运行参数和配置',rosCode('ros2 param get /mavros plugin_denylist\nros2 param get /mavros plugin_allowlist\nsed -n \'1,100p\' /opt/ros/humble/share/mavros/launch/px4_pluginlists.yaml\ngrep -n -A 35 \'/distance_sensor:\' /opt/ros/humble/share/mavros/launch/px4_config.yaml'),'如果denylist中有distance_sensor，即使DISTANCE_SENSOR帧已收到，也不会通过这个插件发布Range；配置条目的id需匹配实际消息。节点命名空间变化时替换/mavros。'),
 uiStep('对一个候选话题检查方向并验证','从实际列表复制话题名，在终端运行 ros2 topic info 话题名 -v；确认MAVROS是发布方后，再用 ros2 topic echo 话题名 --qos-profile sensor_data --once 读值。例如测距在地面把平板移到已知距离，比较对应id的距离和ROS值是否同步变化。','记录最终链路：具体设备/接口 → uORB实例/device_id → MAVLink消息与sensor id → 插件配置条目 → ROS话题、类型、frame_id、单位。')

    config: |
      downward_range_pub:
        subscriber: false
        id: 0
        frame_id: "range_down"
        orientation: PITCH_270

 shStep('复制一份本地配置，保留系统文件',`mkdir -p ~/mavros_sensor_lab
cp -n /opt/ros/humble/share/mavros/launch/px4_pluginlists.yaml ~/mavros_sensor_lab/pluginlists.yaml
cp -n /opt/ros/humble/share/mavros/launch/px4_config.yaml ~/mavros_sensor_lab/config.yaml`,'首次创建本地副本；-n不会覆盖已有文件。如果之前复制过，先对比内容并保留自己的修改。'),
 uiStep('编辑两份本地配置','运行 nano ~/mavros_sensor_lab/pluginlists.yaml，从plugin_denylist中只移除distance_sensor这一项；若allowlist被启用也需允许它。再运行 nano ~/mavros_sensor_lab/config.yaml，找到/**/distance_sensor，用下面内容替换该区块中的示例配置，保留其他插件区块。nano保存用Ctrl+O、回车，退出用Ctrl+X。','运行时使用这两份新配置；不要在已有YAML末尾再粘贴一个重复的distance_sensor键。'),
 {title:'YAML配置内容（不是终端命令）',code:rangeConfigExample,expected:'subscriber:false表示MAVROS接收匹配的飞控消息并向ROS发布；subscriber:true是另一方向。send_tf:false避免用未经测量的外参广播TF。',why:'条目downward_range_pub是你自己起的名字；不是从硬件自动读出的型号。',language:'yaml'},
 uiStep('安排一次可控重启','在地面学习环境先停止旧MAVROS实例，确认没有其他程序依赖当前串口；用下一条命令启动本地配置。后台实例若由服务管理，先按其管理方式停止，不要再开第二个进程抢串口。','只运行一个连接这条串口的MAVROS实例。此教程本身没有替你修改或重启。'),
 shStep('用实际接口和本地配置启动',rosCode(`read -r -p "Verified FCU URL: " STUDY_FCU_URL
read -r -p "Target system ID: " STUDY_SYSTEM_ID
read -r -p "Target component ID: " STUDY_COMPONENT_ID
if [ -n "$STUDY_FCU_URL" ] && [ -n "$STUDY_SYSTEM_ID" ] && [ -n "$STUDY_COMPONENT_ID" ]; then
  ros2 launch mavros node.launch \\
    fcu_url:="$STUDY_FCU_URL" gcs_url:="" \\
    tgt_system:="$STUDY_SYSTEM_ID" tgt_component:="$STUDY_COMPONENT_ID" \\
    pluginlists_yaml:="$HOME/mavros_sensor_lab/pluginlists.yaml" \\
    config_yaml:="$HOME/mavros_sensor_lab/config.yaml"
fi`),'先用node.launch --show-args核对本机参数。新实例应创建插件并收到匹配消息；接口、速率、端口与ID按本次设备或仿真实例填写。'),
 shStep('另一个终端查发布者和一条数据',rosCode('ros2 topic find sensor_msgs/msg/Range\nros2 topic info /mavros/distance_sensor/downward_range_pub -v\ntimeout 8s ros2 topic echo /mavros/distance_sensor/downward_range_pub --qos-profile sensor_data --once'),'如果命名与配置匹配，应看到MAVROS发布者以及米制range值。若实际名称不同，以topic find结果为准。')

function addAutonomyModule(id,name,short,color,prerequisites,goal,rows,refs,terms){

  const [key,title,meaning,analogy,principle,check,mistake]=r;
  autonomyTheory[key]={analogy,principle,check,mistake};plainTopics[key]={title,meaning};
  officialTopicMap[key]=refs;
  return topic(key,title,meaning,principle.join('|'),'先读解释，再打开本主题操作例子；保存输入、输出与自己的结论。',check,mistake);
 });
 curriculum.push(moduleInfo(id,name,short,color,'进阶',prerequisites,goal,'完成本模块的解释、小实验、官方复现和失败案例记录。',topics));
 beginnerModules[id]=[name,short,topics[0].id];officialModuleMap[id]=refs;resourceMap[id]=[...new Set(refs.map(key=>resources[key]?key:'px4'))];moduleTerms[id]=terms;

 ['lio-role','FasterLIO到底在帮飞机做什么？','LIO 是 LiDAR-Inertial Odometry：用雷达与惯性测量估计运动，同时积累点云地图。','像闭着眼走路时用身体感觉猜运动，再通过看到墙的位置纠正；IMU负责短时预测，雷达负责环境约束。',['输入是带时间的雷达点和IMU，不是导航目标；输出是估计位姿、轨迹和点云。','FasterLIO建立在FAST-LIO2思想上，用iVox加速地图近邻检索；FASTER则是另一套轨迹规划项目。','里程计会漂移；有点云图不代表具备回环、重定位或导航避障。'],'能把FasterLIO、FASTER、EGO-Planner、PX4各自负责的问题说清楚。','不要把定位节点的Odometry直接当成控制目标。'],

 ['lio-ivox','iVox为什么能让找邻居更快？','把空间划成小方格，用格子索引快速找附近的地图点。','找书时先定位书架，再查附近几本；不必每次扫整个图书馆。',['体素索引可用floor(x/尺寸)理解，负坐标也要向下取整。','稀疏增量地图只保存实际有点的区域；邻域内找点用于拟合局部平面与构建残差。','体素尺寸、降采样和邻域影响速度、可用约束与精度；并行处理不等于无限性能。'],'比较两种体素大小的格子数与每格点数，解释取舍。','iVox不是碰撞地图；没有点的格子不能直接当成安全空地。'],
 ['lio-input','雷达接好了，算法为什么还收不到？','设备驱动、消息类型、逐点时间、外参和IMU时间轴必须与配置对应。','插头插上只是接了水管；水流方向、接口尺寸和阀门还要匹配。',['先核对型号、驱动和消息；Livox自定义消息与PointCloud2不能仅改话题名互换。','config里的lid_topic、imu_topic、lidar_type、time_scale与外参要逐项解释。','ROS 1的rostopic/rosbag与ROS 2的ros2 topic/bag属于不同环境，桥接也要匹配类型。'],'完成设备→驱动→话题类型→时间→外参的记录表。','示例AVIA外参属于对应装置，不应原样复制给你自己的雷达。'],

addAutonomyModule('ego-course','EGO 规划与轨迹执行','先能解释路线，再跑单机仿真','#9971b5',['planning','roseng','validation'],'能跑通官方ROS 2单机规划例子，区分算法演示与PX4闭环。',[
 ['planner-contract','地图、路径、轨迹、控制到底差在哪？','地图表达环境，路径表达经过的位置，轨迹增加时间，控制器追踪实际运动。','地图是街区图，路径是选哪些街，轨迹是几点到哪，控制是踩油门和修正方向。',['FasterLIO的点云地图不自动等于规划器占据地图；要核对输入格式、范围和坐标。','规划至少需要当前状态、目标、障碍表示与运动限制；失败也必须有输出。','EGO-Planner省去完整ESDF构建，但仍需要环境信息；FASTER另外研究未知环境中的可行备份轨迹。'],'拿一条路径说出还缺什么，才能成为可执行轨迹。','ESDF-free不等于无地图、无障碍检查或可以在任意未知空间飞行。'],
 ['ego-gradient','EGO怎样把一条粗路线变顺？','先找引导方向，再通过优化让轨迹绕开碰撞并满足平滑与运动约束。','像把一根绳子拉顺，同时避开钉子并限制弯折；真实算法还要考虑时间和动力学。',['B样条控制点决定曲线形状，通常不是必须逐一经过的航点。','EGO利用碰撞区域与引导路径构建优化约束，避免预先构建完整ESDF。','优化同时考虑平滑、碰撞和可行性；局部优化可能失败或落在不理想解，需要重新规划与检查。'],'用三点二阶差分说明平滑代价，再解释为什么最平滑的直线仍可能撞墙。','把平滑代价降到零，不代表无碰撞或能到达目标。'],
 ['ego-time','为什么路线一样，飞快一点就跟不上？','带时间的轨迹有速度、加速度和jerk；缩短时间会明显放大运动要求。','同一段路慢走和冲刺，对身体的要求不同。',['时间压缩一半时速度约翻倍、加速度约四倍、jerk约八倍。','轨迹服务器按时间采样曲线，输出位置、速度、加速度等；它不是PX4内部控制器。','应持续检查轨迹开始时刻、有效区间、重规划衔接与输入新鲜度。'],'能计算停车距离和时间缩放关系，解释轨迹为什么不能随意加速播放。','动画播放更快不等于算法或飞控能稳定飞得更快。'],
 ['ego-build','在Humble里应该下载哪个分支？','优先使用作者提供的ego-planner-swarm/ros2_version，从单机开始。','先确认教材是哪一版，再用对应的编译器和启动方法。',['原ego-planner/master和swarm/master是catkin；ros2_version使用ament/colcon。','在独立工作空间构建，先检查依赖再启动；ARM64与x86_64分别编译。','该分支README建议CycloneDDS；只在实验终端设置RMW，记录效果，不把它视为所有ROS故障的通用修复。'],'colcon list能找到ego_planner，构建后ros2 pkg prefix指向本工作空间。','仅克隆源码不等于安装完成；找不到包时先查构建与source。'],
 ['ego-run','怎样跑单机仿真并知道它真的在规划？','启动官方单机例子，观察地图、里程计、样条和轨迹服务器输出。','先用模型车验证路线选择，再更换成真实车辆。',['single_run_in_sim.launch.py提供单机入口，rviz.launch.py提供显示。','use_dynamic:=False使用简化位置命令到里程计模型；True启用仓库动力学模型，二者都不是PX4。','确认实际话题类型与发布者，地图和里程计有效后再给仿真目标；记录无解与取消情况。'],'能找到实际Odometry、Bspline和PositionCommand，解释谁发布、谁使用。','RViz里飞机移动不等于已经连接MAVROS或完成PX4 SITL验证。'],
 ['ego-px4','规划结果怎样才接得上PX4？','需要单独的轨迹执行/适配层，核对坐标、时刻、消息和飞控状态。','规划器写行程表，适配层把行程转换成驾驶员听得懂的指令，还要看车辆是否接受。',['traj_server的PositionCommand不是MAVROS位置目标消息；不能只重命名话题。','规划坐标、机体参考点、ENU/NED、轨迹时间、协方差与定位重置要有明确接口约定。','先在SITL测试固定目标、轨迹和丢失输入；随后再验证模式、控制权、限幅与反馈。'],'写出适配接口表并在SITL记录目标与实际状态，输入过期有确定处理。','不要绕过PX4估计有效性与Offboard条件；本节查询命令不会自动解锁飞行。']

 ['swarm-predict','现在隔得很远，为什么还可能相撞？','要比较同一未来时刻的位置，而不是只比当前距离或几何路线交叉。','两个人现在在走廊两端，却可能一秒后同时到中间。',['在共同时间轴上预测两条轨迹，比较距离与机体及误差裕量。','轨迹过期、网络延迟和时钟差都会影响预测；没有更新不能解释成邻机消失。','有限采样可能漏过采样间碰撞，需连续检查或保守界限；演示阈值不是实机设置。'],'算出简单匀速交汇的最近时刻与距离，解释当前安全为什么不足够。','不能只测试随机场景；要包含对向、交叉、拥堵、静止障碍和通信异常。'],
 ['swarm-run','怎样从一架扩展到多架仿真？','先复现同一个单机版本，再启动官方swarm入口并逐机检查。','一辆模型车能走通以后，再给每辆车分配身份与路线，逐辆增加。',['使用同一提交和工作空间，先停单机实例再启动swarm.launch.py，避免同名冲突。','核对每架机的输入输出、初始位置、目标和邻机轨迹通道；以实际launch与ROS图为准。','默认仿真规模不代表Linux 主机承载能力；逐步加机数并测CPU、内存、延迟。'],'每架仿真机都有独立轨迹与里程计，能解释一次避让或失败。','不要同时照抄多个同ID实例；共享ROS_DOMAIN_ID也不是自动完成多机配置。'],
 ['swarm-health','邻机消息断了，应该当作没障碍吗？','消息新鲜度与有效性必须进入任务状态，不能无限使用旧轨迹。','导航地图停在十秒前，需要知道它已过时，而不是继续照走。',['记录发送时刻、接收时刻、轨迹有效区间和消息序号，区分延迟、丢包与重放。','输入失效后的策略由系统设计和场景决定，应在仿真记录具体行为及恢复条件。','接收频率正常仍可能收到重复旧数据；应同时检查时间戳与状态连续性。'],'模拟轨迹年龄超过测试阈值，输出明确的无效状态，恢复后重新检查。','教程阈值用于演示，不是任何飞行器都适用的安全参数。'],

d=math.hypot(*(a+t*b for a,b in zip(p,v)))
print('closest_time_s=',t,'closest_distance_m=',d)

function labWorld(flavor,kind){
 const f=labSoftware[flavor],system=(file,name,content='')=>`<plugin filename="${f.prefix}-${file}-system" name="${f.ns}::systems::${name}">${content}</plugin>`;
 const inertial=mass=>`<inertial><mass>${mass}</mass><inertia><ixx>0.01</ixx><iyy>0.01</iyy><izz>0.01</izz></inertia></inertial>`;
 const link=(name,pose,shape,mass=1)=>`<link name="${name}"><pose>${pose}</pose>${inertial(mass)}<collision name="collision"><geometry>${shape}</geometry></collision><visual name="visual"><geometry>${shape}</geometry><material><ambient>0.15 0.45 0.9 1</ambient><diffuse>0.15 0.45 0.9 1</diffuse></material></visual></link>`;
 const wheel='<cylinder><radius>0.1</radius><length>0.06</length></cylinder>';
 const joint=side=>`<joint name="${side}_joint" type="revolute"><parent>body</parent><child>${side}_wheel</child><axis><xyz expressed_in="__model__">0 1 0</xyz></axis></joint>`;
 const robot=`<model name="learning_robot"><pose>0 0 0.05 0 0 0</pose>${link('body','0 0 0.18 0 0 0','<box><size>0.6 0.4 0.2</size></box>')}${link('left_wheel','0 0.23 0.1 1.570796 0 0',wheel,.1)}${link('right_wheel','0 -0.23 0.1 1.570796 0 0',wheel,.1)}<link name="caster"><pose>-0.22 0 0.05 0 0 0</pose>${inertial(.05)}<collision name="collision"><geometry><sphere><radius>0.05</radius></sphere></geometry><surface><friction><ode><mu>0.01</mu><mu2>0.01</mu2></ode></friction></surface></collision><visual name="visual"><geometry><sphere><radius>0.05</radius></sphere></geometry></visual></link>${joint('left')}${joint('right')}<joint name="caster_joint" type="fixed"><parent>body</parent><child>caster</child></joint>${system('diff-drive','DiffDrive','<left_joint>left_joint</left_joint><right_joint>right_joint</right_joint><wheel_separation>0.46</wheel_separation><wheel_radius>0.1</wheel_radius><topic>/learn/cmd_vel</topic><odom_topic>/learn/odom</odom_topic><odom_publish_frequency>20</odom_publish_frequency>')}</model>`;
 const camera=`<model name="scene_camera"><static>true</static><pose>-3 0 1.2 0 0.15 0</pose><link name="camera_link"><sensor name="camera" type="camera"><always_on>true</always_on><update_rate>10</update_rate><topic>/learn/camera</topic><camera><horizontal_fov>1.047</horizontal_fov><image><width>640</width><height>480</height><format>R8G8B8</format></image><clip><near>0.1</near><far>50</far></clip></camera></sensor></link></model>`;
 return `<?xml version="1.0"?>\n<sdf version="1.8"><world name="learn_world"><gravity>0 0 -9.81</gravity><physics name="default" type="ignored"><max_step_size>0.001</max_step_size><real_time_factor>1</real_time_factor></physics>${system('physics','Physics')}${system('user-commands','UserCommands')}${system('scene-broadcaster','SceneBroadcaster')}${kind==='camera'?system('sensors','Sensors','<render_engine>ogre2</render_engine>'):''}<light name="sun" type="directional"><pose>0 0 8 0 0 0</pose><diffuse>0.8 0.8 0.8 1</diffuse><direction>-0.5 0.1 -0.9</direction></light><model name="ground"><static>true</static><link name="ground"><collision name="ground_collision"><geometry><plane><normal>0 0 1</normal><size>40 40</size></plane></geometry></collision><visual name="ground_visual"><geometry><plane><normal>0 0 1</normal><size>40 40</size></plane></geometry><material><ambient>0.65 0.65 0.65 1</ambient></material></visual></link></model>${kind==='box'?`<model name="falling_box"><pose>0 0 2 0 0 0</pose>${link('box','0 0 0 0 0 0','<box><size>0.4 0.4 0.4</size></box>')}</model>`:robot}${kind==='camera'?camera:''}</world></sdf>\n`;
}
function writeWorldCode(flavor,kind){return pythonCode(`from pathlib import Path
target=Path.home()/'ros2_sim_lab'/'worlds'/${JSON.stringify(kind+'-'+flavor+'.sdf')}
text=${JSON.stringify(labWorld(flavor,kind))}
target.parent.mkdir(parents=True,exist_ok=True)
if target.exists() and target.read_text()!=text:
    raise SystemExit('File contains your edits; keep it and choose another filename.')
target.write_text(text)
print(target)`)}
const startWorldCode=(f,k)=>`${labSoftware[f].cmd} -r ~/ros2_sim_lab/worlds/${k}-${f}.sdf`;
function gzMotion(flavor,speed,turn){const f=labSoftware[flavor];return `timeout -s INT 3s ${f.topic} -t /learn/cmd_vel -m ${f.message}.Twist -p 'linear: {x: ${speed}}, angular: {z: ${turn}}'\ntimeout -s INT 2s ${f.topic} -t /learn/cmd_vel -m ${f.message}.Twist -p 'linear: {x: 0.0}, angular: {z: 0.0}'`}

defineLab('camera-connect','perception','相机插入后：先认设备，再选驱动','从接口、采集节点与格式开始，不要求固定计算机或开发板。','先确认电脑认出麦克风和输入端口，再谈分析声音；相机也是同样的顺序。',['USB UVC、CSI、双目和深度设备的驱动路线不同。','同一相机可能出现多个video节点，部分节点只提供元数据。','WSL/虚拟机要有设备透传，宿主能看见不等于客体能采图。'],'设备接在真正运行驱动的Linux环境；记录型号和接口。',[

defineLab('camera-driver','perception','发布相机图像：驱动、画面、频率和时间','把采集设备变成ROS Image，并确认它确实在更新。','驱动是视频来源，图像查看器只是订阅显示器。',['设备格式和驱动支持范围都要满足。','Image传像素，CameraInfo传成像参数；CameraInfo存在不代表已标定。','每个终端独立加载ROS，避免多个驱动抢一个设备。'],'本例明确为Ubuntu22.04/Humble + 支持640×480 YUYV的UVC设备；其他设备按驱动与实际格式调整。',[

defineLab('camera-model','perception','内参是什么：三维点怎样落到像素','内参描述镜头成像，不描述相机安装的位置。','焦距像窗户的放大规则，主点决定图上“中心”在哪里。',['fx/fy是像素单位焦距，cx/cy是主点，K组织这些参数。','理想模型u=fx·X/Z+cx、v=fy·Y/Z+cy，X/Y/Z在光学坐标。','D描述畸变；单个像素通常无法确定米制深度。'],'可先离线学习；图解数值是教学值，不是你的镜头标定。',[
 uiStep('先认单位和坐标','像素u向右、v向下；常见光学坐标X向右、Y向下、Z向前。fx=500表示像素尺度，不是500毫米。','分清像素位置与真实米制位置。'),

],[['没有CameraInfo或K为0','先核对驱动接口，继续标定与配置加载。'],['只有一个普通摄像头','可看图与跟踪特征；深度或尺度需额外约束，不能把u/v直接当xyz。']],['cameraInfo'],PYTHON+'；消息查询在ROS终端');
defineLab('camera-extrinsics','perception','外参是什么：相机装在哪里，朝向哪里','外参是两个坐标系之间的旋转和平移，要写清变换方向。','把一把尺子转向再挪动，同一点在两把尺子上的数字不同。',['光学系右/下/前与机体系前/左/上常不一样。','p_body=R_body_camera·p_camera+t_body_camera，先旋转再平移。','CameraInfo不是安装外参，棋盘单目标定不自动提供相机—IMU时空关系。'],'先做示意计算，实际装置需要测量和标定。',[

defineLab('calibration','perception','自己做棋盘标定：准备、采样、保存、加载、复查','把内参概念变成连续操作，不在拿到一份YAML后停止。','校准一把尺子的整张刻度，得看不同位置与姿态，不能只测中心一次。',['size是内角点列×行，不是方格数；square是实测米制边长。','样本覆盖左右上下、远近和倾斜，保持平整清晰。','Save、Commit、驱动加载与CameraInfo检查是不同动作。'],'驱动正常。示例8×6内角点和25mm格子必须替换为你实测的棋盘参数。',[

topic=os.environ['STUDY_IMAGE_TOPIC']
previous=None; points=None
def callback(msg):
    global previous,points
    try: frame=bridge.imgmsg_to_cv2(msg,desired_encoding='bgr8')
    except Exception as error:
        node.get_logger().warning(str(error)); return
    gray=cv2.cvtColor(frame,cv2.COLOR_BGR2GRAY)
    if previous is not None and points is not None and previous.shape==gray.shape:
        moved,status,_=cv2.calcOpticalFlowPyrLK(previous,gray,points,None)
        if moved is not None and status is not None:
            good=status.reshape(-1)==1
            for new,old in zip(moved[good].reshape(-1,2),points[good].reshape(-1,2)):
                cv2.line(frame,tuple(np.round(old).astype(int)),tuple(np.round(new).astype(int)),(0,255,0),1)
                cv2.circle(frame,tuple(np.round(new).astype(int)),3,(0,200,255),-1)
    points=cv2.goodFeaturesToTrack(gray,maxCorners=100,qualityLevel=.02,minDistance=10)
    previous=gray
    cv2.imshow('Feature movement only - not metric pose',frame); cv2.waitKey(1)

defineLab('sim-aircraft-dynamics','validation','真正换成自己的飞机：旋翼、推力、气动与控制分配','把CAD外形升级为代表自己飞机的动力学，需要明确数据和逐层验证。','换了外壳不代表换了发动机和重量分布，要把每项变化分别接到对应模型。',['旋翼数量、位置、轴、旋向和motorNumber要与PX4控制分配及输出函数对应。','推力模型常含F=kω²、反扭矩、响应时间与阻力；参数来自台架/文献或可追溯模型，不能从STL自动得到。','固定翼/VTOL还需升阻力、舵面、空速与转换模式；按对应官方模板建立，不能用多旋翼推力代替机翼气动。'],'已完成外观基线；这一节在离线表格与模型配置中设计，不替你猜未知硬件参数。',[
 shStep('列出当前基线的执行器映射','read -r -p "PX4 source root: " STUDY_PX4_ROOT\nif [ -f "$STUDY_PX4_ROOT/ROMFS/px4fmu_common/init.d-posix/airframes/4001_gz_x500" ]; then\n  grep -nE \'CA_ROTOR|CA_AIRFRAME|SIM_GZ_EC_FUNC\' "$STUDY_PX4_ROOT/ROMFS/px4fmu_common/init.d-posix/airframes/4001_gz_x500"\nfi\ngrep -nE \'motorNumber|jointName|turningDirection|motorConstant|maxRotVelocity\' "$HOME/gazebo_custom_lab/models/my_x500_visual/model.sdf"','形成0-based motorNumber→旋翼joint/link→旋向→PX4输出函数的映射，注意各文件坐标约定。'),

 C('建立自己的模型参数表','把几何、动力与控制配置分三栏，未知值留下验证计划。','每个修改有来源，能解释为何需要同改其他接口。',['几何栏：电机坐标/旋转轴、质心、总质量、惯量及碰撞；注明Gazebo模型轴与PX4 FRD表达的转换，不能直接拷贝坐标正负。','动力栏：推力/扭矩系数、最高转速、响应时间、阻力/升阻力；记录测量条件、单位和适用范围。','控制栏：PX4对应机架、CA_ROTOR位置/反扭矩、SIM_GZ_EC_FUNC或舵机映射、模式和估计来源；不要仅给模型换个名字。','四旋翼改变臂长也要同步碰撞、视觉、旋翼位置和控制分配。固定翼/VTOL用相应官方机架与模型，不沿用4001。']),
 C('先验证作用方向，再做整机飞行','不使用一个完整飞行结果掩盖错误映射。','能够在仿真中说明每个执行器增加时应产生什么力/力矩。',['在独立仿真副本对照单个旋翼位置、旋向与输出序号，保存模型和airframe版本；不要连实体执行器做本课实验。','用明确的低级仿真试验/日志确认方向与推力响应；若尚未实现该试验节点或模型接口，列为待实现，不用随机改参数。','完成质量/传感器/执行器证据后，再按下一节分级验收。优化PID应在模型结构和单位正确之后进行。'])

defineLab('sim-custom-validation','validation','自己的场景和飞机怎样验收、排错与回滚','分阶段比较，既知道已经验证的部分，也知道还缺哪些证据。','同一套实验先做标准装置，再每次只换一项，失败才能找到来源。',['文件解析、资源显示、接触物理、传感器、估计与控制是不同验收层级。','所有比较记录world、模型包、PX4与参数版本，避免旧服务端或旧参数被误认为新配置。','换场景会影响GNSS、光照、遮挡、风和传感器视角；不能假设只是换背景图片。'],'有默认x500、外观副本与当前自定义世界；先在独立SITL环境验证，不导入实体飞控参数。',[
 shStep('Harmonic：先解析带本地include的模型包',`${customPX4Environment}
export SDF_PATH="$HOME/gazebo_custom_lab/models:$STUDY_PX4_ROOT/Tools/simulation/gz/models\u0024{SDF_PATH:+:$SDF_PATH}"
gz sdf -k "$HOME/gazebo_custom_lab/models/my_x500_visual/model.sdf"
gz sdf -k "$HOME/gazebo_custom_lab/worlds/px4_training.sdf"`,'独立gz sdf解析器按本机版本还可能需要SDF_PATH来解析model://include。Gazebo服务端用GZ_SIM_RESOURCE_PATH；通过解析仍要继续运行检查。'),
 shStep('保存这一轮资产清单与哈希',pythonCode(`import hashlib,json
from pathlib import Path
root=Path.home()/'gazebo_custom_lab'
files=[]
for p in sorted(root.rglob('*')):
    if p.is_file() and p.suffix.lower() in {'.sdf','.config','.obj','.stl','.dae','.mtl','.png','.jpg'}:
        files.append({'file':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
print(json.dumps(files,indent=2))`),'得到可对照清单；同时保存PX4提交、模型子模块、启动环境变量和本次临时工作目录。'),
 C('按六层逐步检查','当前层没有通过就先解决，不把后面问题混进来。','每层有输入、预期、实际与失败原因。',['第1层：gz sdf -k解析；第2层：静态网格尺寸、轴、贴图和资源路径；第3层：质量、碰撞与接地；每层保存一张图或日志。','第4层：传感器真实时间/频率与方向；第5层：估计有效性与重置；第6层：目标、模式、执行器和实际响应。','先默认x500默认世界，再x500自定义世界，再自有外观保持x500物理，再单项更改真实动力参数；每次保留前一版。']),
 C('典型问题按来源查','不同现象对应不同层。','不以“重启全部程序”代替解释。',['找不到URI/贴图：资源与相对路径；模型巨大/倒置：单位与坐标；穿地/抖动：碰撞与惯性。','PX4等场景或等传感器：world时钟、实例名、系统配置与分区；解锁翻转：输出映射/旋向/惯量；轨迹误差大：再查动力和控制。','实时因子下降：检查网格面数、传感器渲染率、物理步长和CPU/GPU资源，降低显示负载不等于已解决实时性。']),

// The short meaning stays useful in cards; every term also has a complete article.
function G(id,explanation,flow,worked,code,expected,related,question,answer,language='bash'){
 const term=glossary.find(t=>t.id===id);if(!term)throw Error('Unknown glossary term '+id);
 term.detail={paragraphs:explanation.split('|'),flow:flow.split('|'),worked,code,expected,related:related.split(' '),question,answer,language};
}
G('terminal','终端是接收键盘输入、显示文字输出的界面，Shell才是解释命令的程序。Bash与PowerShell使用不同语法，所以同一段命令不能随意跨窗口粘贴。|每条命令在某台主机、某个目录和某个进程环境里执行。先确认这三件事，才能解释为什么文件找不到、source无效或程序无法显示窗口。','终端把文字交给Shell|Shell查命令、展开变量并启动进程|进程把输出和退出码交回终端','同一台Windows电脑可以同时打开PowerShell和WSL Bash；SSH后又进入另一台Linux主机。屏幕都像命令窗口，但文件路径、软件和设备来自不同环境。','whoami\nhostname\npwd\nprintf "%s\\n" "$SHELL"','分别确认用户、主机、目录和登录Shell。$SHELL是线索，不保证等于当前解释器的实际进程。','ssh source package','进入某个目录，会自动加载ROS环境吗？','不会。cd改变工作目录，source读取环境脚本；这是两种不同动作。');
G('ssh','SSH通过加密网络连接让你使用另一台主机的Shell。登录后，命令通常在远端执行，而不是继续操作发起连接的电脑。|它解决远程访问，不代替ROS通信、相机驱动或图形桌面。网络能SSH，也不能直接证明DDS多播或MAVLink端口可用。','填写实际用户名和主机地址|完成身份认证，进入远端Shell|在远端启动程序并查看结果','你在笔记本连接实验主机后运行ls /dev，看到的是实验主机的设备。如果摄像头接在笔记本，远端不会因此自动得到摄像头。','whoami\nhostname\nip -br addr','在连接前后对照主机名和地址，确认当前命令在哪里运行。','terminal domain node','关闭SSH窗口后，节点一定会继续运行吗？','不一定。前台程序可能随终端结束；需要持续运行时按服务或会话管理方式部署，不能仅凭之前启动成功判断。');
G('source','source在当前Shell进程中执行脚本，所以脚本对PATH等变量的修改会保留在这个终端里。直接用bash script.sh启动子Shell，效果通常不会反向传给父Shell。|ROS环境脚本用于告诉工具去哪里找软件包、库和消息类型。系统ROS是underlay，自建工作空间是overlay；加载顺序影响同名包的选择。','先加载系统ROS|再加载需要的工作空间|检查实际解析出的包路径','终端A加载过install/setup.bash不代表终端B也加载过。修改代码并构建后，新终端还要指向正确的安装产物。',rosCode('command -v ros2\nprintf "%s\\n" "$ROS_DISTRO"\nros2 pkg prefix rclcpp'),'ros2有可执行路径，发行版与包位置符合预期；这不会启动任何业务节点。','terminal package launch','source成功后，MAVROS会自动开始连接飞控吗？','不会。环境准备和进程启动分开；仍需要明确的run或launch命令。');
G('node','节点是ROS图里参与通信的逻辑单元，可以拥有发布者、订阅者、服务、定时器和参数。一个进程可以承载一个或多个节点。|源码包、可执行程序、操作系统进程与节点名是不同层次。知道节点名后，才能检查它的输入输出，而不能只按源码文件名猜。','可执行程序启动进程|进程创建节点及通信端点|节点回调处理收到的数据或定时任务','study_cpp是包，hello是程序，study_hello是节点。它们不必同名；组件容器还可把多个节点放在同一进程中。',rosCode('ros2 node list'),'列出当前可发现的节点，随后对真实名字使用ros2 node info；列表不是所有已安装软件。','package publisher subscriber','node list没有节点，重启daemon能自动启动相机吗？','不能。daemon用于辅助发现/查询；采图仍需要真实驱动进程。');
G('package','软件包把源码、构建说明、依赖和安装资源组织起来。package.xml说明包名与依赖，CMake或Python构建文件决定哪些程序和资源被安装。|ros2 run使用包名和安装后的可执行程序名；进入源码目录不等于构建成功，也不等于环境已经找到该包。','源码与依赖组成包|构建系统生成并安装产物|ROS按环境查找程序和资源','学习包study_cpp中的main.cpp被编译成hello，节点在程序里另取名study_hello。运行名来自构建/安装规则。',rosCode('ros2 pkg prefix rclcpp\nros2 pkg executables turtlesim'),'能查到已安装包的前缀和程序；若未安装turtlesim，其查询失败只是该包不存在。','node source launch','把一个.cpp复制到src里，就能用ros2 run运行吗？','不能。还要有构建目标、依赖与安装规则，成功构建后加载正确工作空间。');
G('topic','话题是带名称和消息类型的发布/订阅接口。发布者与订阅者通过它交换数据，双方通常无需直接调用彼此。|同一个话题可以有多个端点；名字相同还需要类型和QoS兼容。话题列表可能由订阅端点产生，不能只看名字判断有实际测量。','发布者注册话题和类型|兼容订阅者被发现并匹配|实际消息到来后触发订阅回调','/camera/image_raw是名称，sensor_msgs/msg/Image是类型。相机驱动发布，查看器订阅；仅打开查看器不能凭空制造视频。',rosCode('ros2 topic list -t'),'得到真实话题及类型，再选一条检查info -v与有限时echo。','message publisher subscriber','能看到vision_pose/pose，就说明相机已连上了吗？','不能。它可能只有MAVROS订阅者，是外部程序送往飞控的输入口。');
G('message','消息是按接口定义组织的一条数据，字段可能包含标量、数组、嵌套消息、时间与坐标信息。必须结合类型定义解释数字的含义。|传输成功只能证明收到了这些字节，不能保证单位、坐标、采样时刻或数据有效性正确。','接口定义规定字段和类型|发布者按定义填值|订阅者按相同语义解释','Imu里的angular_velocity与linear_acceleration分别表达角速度与加速度计测量；orientation可能无效，需按协方差约定判断。',rosCode('ros2 interface show sensor_msgs/msg/Imu'),'看到字段、单位注释和无效值约定；不需要传感器正在运行。','topic time frame','收到三个数，就能判断它是位置吗？','不能。三个数也可能是速度、角速度、力或其他量，要先看消息类型与字段语义。');
G('publisher','发布者是节点中向话题写消息的端点。节点可以创建发布者后暂时不发数据，也可以按事件或定时器决定发送时机。|发布者数量有助于判断数据来源与重复启动，但不能代替频率、时间戳和实际消息检查。','节点创建发布端点|程序得到有效输入并生成消息|调用发布，接收端观察数据','MAVROS某插件可以先创建Range发布者，却因没有匹配MAVLink帧而不发数值；Publisher count大于0仍可能超时。',rosCode('ros2 topic list -t\nros2 node list'),'按真实名称继续用topic info -v定位端点所属节点，不以端点存在当作数据有效。','subscriber topic plugin','发布者数量2一定比1更可靠吗？','不一定。可能是重复驱动或两个来源混在同名话题，反而需要隔离与确认。');
G('subscriber','订阅者登记希望接收的话题、类型、QoS和回调。匹配发布者发来消息后，执行器调度回调处理它。|订阅命令常会等待，因此终端没有输出可能只是没有收到匹配消息，不能把等待直接解释成节点崩溃。','创建订阅与QoS|发现兼容发布者|收到数据后执行回调','ros2 topic echo本身就是一个订阅者。先启动echo不会替你启动相机或MAVROS；退出echo通常只影响这个观察工具。',rosCode('ros2 topic echo --help'),'查看--once、字段和QoS等选项。实际订阅前使用真实话题名，必要时用timeout限制等待。','publisher qos node','订阅者在列表里，为什么没有消息？','依次检查发布者、实际流量、类型、域、QoS和网络，不能只重复启动订阅。');
G('qos','QoS是通信策略组合，包括可靠性、持久性、历史深度等。发布者提供能力，订阅者提出要求，兼容后才能正常匹配。|可靠性更强不等于任何场景都更及时。高频传感器常更关注新鲜数据，具体策略要看链路和接口需求。','查看两端实际策略|判断requested/offered兼容性|匹配后再测实际收到的频率与延迟','若发布者只提供best_effort，而订阅者要求reliable，可能不匹配。反向组合不能照同一结论推断；要逐项核对。',rosCode('ros2 topic info /mavros/imu/data -v'),'在实际话题存在时看到端点QoS；命名空间不同需替换，不存在时先发现真实名称。','publisher subscriber hz','把所有订阅都改成reliable能修好没有数据吗？','不能。先查真实发布策略，兼容性与数据来源都正确后再评估丢包和时效。');
G('service','服务使用一次请求与一次响应，适合查询、设置或快速操作。客户端等待服务可用后发送请求，服务端处理再答复。|响应中“接受”或“成功”的含义由接口定义，可能只表示命令被接收，物理动作仍需要后续状态确认。','发现服务和接口|发送结构化请求|读取响应并对照业务状态','请求飞控切换模式得到接受，不等于飞机已经进入并稳定保持该模式；还要看实际模式与拒绝日志。',rosCode('ros2 service list -t'),'列出真实服务和类型，先查看接口再构造请求；本例不调用控制服务。','action parameter offboard','服务返回成功能证明飞机到达目标点吗？','不能。应订阅实际状态并按误差、时间和模式等条件确认结果。');
G('action','Action把长任务组织成目标、反馈和最终结果，还包含取消等协议。适合导航、机械臂动作等需要持续观察的工作。|它提供任务通信结构，不自动实现控制器、避障或可靠的停止行为；这些仍由服务端实现。','发送目标并确认接受|运行中接收反馈或请求取消|读取最终结果并核对实际状态','导航Action可能反馈剩余距离。取消请求被接受后，还要确认任务状态与机器人实际运动已经按设计停止。',rosCode('ros2 action list -t'),'只查询已存在的Action接口；不是所有MAVROS操作都采用Action。','service setpoint trajectory','有Action接口，就不需要任务状态机了吗？','仍需要。接口管理请求，业务代码还要处理估计失效、控制权、超时和恢复。');
G('parameter','参数是某个程序的配置值。ROS节点参数属于节点，PX4参数属于飞控配置系统，二者名称和管理方式不同。|改文件、启动时覆盖参数、运行时设置参数可能产生不同结果。先读当前实际值与作用，再按对应版本修改。','找到参数归属节点或飞控|查询类型、当前值和文档|更改后核对生效范围与状态','plugin_denylist控制MAVROS插件，COM_OF_LOSS_T属于PX4的Offboard失联处理。名字都像配置，却不属于同一层。',rosCode('ros2 param list'),'列出可发现节点参数；查询具体参数时使用真实节点。飞控参数用PX4控制台另查。','launch plugin fcu','修改YAML后，运行节点一定立即变吗？','不一定。文件可能只在启动时读，或被其他启动参数覆盖，必须查运行值。');
G('launch','Launch描述启动哪些进程、参数、命名空间、重映射及条件，能把多终端步骤组织成可重复入口。|启动文件不是算法本身。它可以被参数覆盖，还可能包含其他文件，所以只看一个默认值未必知道最终配置。','解析启动参数与包含关系|创建节点和资源|运行时核对最终参数及ROS图','同一相机launch把命名空间改成/camera后，图像变为/camera/image_raw；照抄旧名字会找不到接口。',rosCode('ros2 launch --help'),'了解show-args与启动语法，再查当前包实际安装的launch入口。','parameter namespace source','launch没有报错就说明闭环正常吗？','不能。还要检查消息、输入有效性、状态与实际行为。');
G('namespace','命名空间给节点和接口名称添加前缀，帮助组织多实例。相对名称通常受前缀影响，绝对名称则有自己的解析规则。|它隔离名字，不自动隔离硬件、坐标、时间、MAVLink身份或控制权限。','明确相对名和绝对名|应用命名空间与重映射|检查解析后的完整名称','/uav1/odom和/uav2/odom能区分两架机状态，但两个消息里的frame_id都叫odom时，仍需约定各自坐标关系。',rosCode('ros2 node list\nros2 topic list -t'),'记录完整名字，使用node info检查某一实例真正连接的端点。','domain instance frame','给两架机不同前缀，串口和UDP端口也会自动分开吗？','不会。通信设备、端口、ID与公共坐标需要分别配置。');
G('domain','ROS_DOMAIN_ID把DDS发现和通信分成不同域。相同域是节点互相发现的常见前提之一，但网络与QoS等仍需满足。|域编号不是加密、认证或访问密码，也不等于MAVLink系统ID。不同终端的环境可能设置不一致。','各进程启动时读取域设置|同域参与发现匹配|网络与端点条件决定是否通信','终端A在域0，终端B在域7，即使同机也可能互相看不到。修改一个终端不会改变已经启动的另一个进程。','printf "ROS_DOMAIN_ID=%s\\nRMW=%s\\n" "$ROS_DOMAIN_ID" "$RMW_IMPLEMENTATION"','空值常表示沿用默认配置；对所有相关进程记录实际启动环境。','dds namespace qos','同域但是看不到消息，下一步查什么？','继续查进程、网卡、多播/发现方式、容器或WSL网络、类型和QoS，不只反复换域。');
G('frame','坐标系规定原点和三根轴。位置、速度、方向都必须说明在哪个坐标系表达，frame_id就是消息给出的参考标签之一。|标签并不执行变换。把frame_id从camera改成map而不改数值，会让接收者误解这些数字。','确定原点与轴方向|确认消息字段在哪一系表达|用正确变换换算后再改参考标签','相机前方2米在optical坐标常是Z=2；在常见机体FLU坐标可能接近X=2。两套数值代表同一点需要相机外参。',rosCode('ros2 interface show geometry_msgs/msg/PoseStamped'),'查看header与pose，再用实际数据核对frame_id和时间。','tf extrinsics quaternion','相同frame_id是否证明两个定位器已经对齐？','不证明。它们可能各自把启动原点叫同一个名字，需要明确实际原点、朝向与变换。');
G('tf','TF维护有父子关系、带时间的坐标变换，使程序可以把数据从一个参考系换算到另一个参考系。固定关系与随时间变化的关系处理方式不同。|查询必须有连通的变换链，并且时间有效。消息有frame_id但缺TF时，显示或融合可能失败。','发布真实父子变换|缓存变换及其时刻|按所需时刻查询并连乘换算','base_link到camera_optical_frame的固定外参能把相机点放到机体；map到base_link则随运动变化，不能随便设成静态。',rosCode('ros2 run tf2_ros tf2_echo --help'),'使用真实父子frame查询；工具参数以本机帮助为准。','frame extrinsics time','No transform只要把Fixed Frame随便改掉就算修好了吗？','不能。选择传感器自身frame可用于单独检查，但完整系统仍需正确且连通的变换链。');
G('time','时间戳说明数据对应的时刻，可能来自传感器采样、估计或计算完成。系统墙钟、设备启动时间与仿真时间不是同一时间轴。|比较消息年龄前先确认时间基准一致；还要区分数据本身滞后、处理耗时与网络传输延迟。','确认时间原点与同步方式|保留真实采样/估计时刻|以同一时基检查年龄和变换有效性','图像是100毫秒前采的，即使刚收到，地图仍可能使用过期观测。把stamp改成当前时间会掩盖延迟，而不会把旧图像变成新测量。','date -Is\ntimedatectl status','只检查主机时钟状态；还不能证明相机、IMU和飞控已完成测量时间对齐。','hz tf vio','收到消息时才填now，能解决相机—IMU同步吗？','不能。必须了解采样与传输链，按真实时刻同步或建模延迟。');
G('hz','Hz表示每秒发生次数。固定50Hz对应20毫秒周期，但实际系统会受到调度、网络、队列和负载影响。|平均频率可能掩盖长停顿，安全相关链路要同时看最大间隔、数据年龄和异常时行为。','记录相邻到达或采样间隔|统计频率和间隔分布|在负载与异常下检查最坏情况','99次间隔20毫秒、一次500毫秒，平均值仍可能看着不错；任务程序却可能已经经历明显断流。',rosCode('ros2 topic hz --help'),'了解工具选项，再对实际话题做有限时统计；它测到的是本订阅端接收情况。','qos time offboard','hz显示50，就能保证每次都准时吗？','不能。查看间隔分布和最大值，并区分消息生成与本机接收时刻。');
G('imu','IMU通常组合陀螺仪与加速度计。陀螺仪测角速度，加速度计测比力；姿态或位置通常需要后续算法估计，不能把原始采样直接当定位结果。|静止且传感器正常时，陀螺仪接近零，加速度计幅值常接近重力加速度。方向取决于安装、坐标定义与输出是否经过补偿。','硬件采样并校准|驱动发布角速度与加速度等观测|估计器结合其他约束估计状态','桌上不动时看到约9.8m/s²并不一定是机器人在加速；应先理解测量包含重力效应和具体消息语义。',rosCode('ros2 interface show sensor_msgs/msg/Imu'),'先看单位、姿态无效和协方差约定，再对真实话题做静止/已知转动实验。','raw covariance ekf','将加速度连续积分两次，就能长期得到精确位置吗？','不能。偏置、姿态误差、重力处理与时间误差会累积，需要其他可观测约束。');
G('quaternion','单位四元数用四个相互约束的数表示三维旋转，适合组合旋转和连续估计。它不是四个独立角度，通常要求模长为1。|ROS字段常按x/y/z/w，其他接口可能按w/x/y/z；q与-q表示相同旋转，因此直接比较四个分量可能误判姿态跳变。','确认字段顺序与旋转方向|检查归一化和坐标约定|组合、转换或插值后验证已知轴','绕z轴90°时，ROS顺序可写成(0,0,0.7071,0.7071)。把w放错位置会表达另一种姿态。',pythonCode('import math\nq=(0.,0.,math.sin(math.pi/4),math.cos(math.pi/4))\nprint("ROS xyzw=",q)\nprint("norm=",math.sqrt(sum(x*x for x in q)))'),'模长约1；此例仅表示已定义坐标约定下绕z轴旋转90°。','rpy frame tf','四元数分量符号一起反了，姿态一定反了吗？','不一定。q与-q表示同一旋转；判断变化应使用旋转距离等合适的方法。');
G('rpy','roll/pitch/yaw是欧拉角的一种常见表达，分别用于描述横滚、俯仰与偏航。必须说明旋转顺序、内禀/外禀约定及轴方向。|三维旋转通常不交换，先偏航再俯仰和反过来结果不同。欧拉角还可能出现奇异性，不能在所有姿态下当作三个独立线性量。','先明确参考系与约定|按规定次序组合旋转|用已知方向和边界姿态验证','同样写yaw=90°，在ENU与NED等不同约定里不能只凭数字判断朝向；还要看世界轴和机体轴定义。',pythonCode('import math\nprint("90 degrees in radians=",math.pi/2)\nprint("180 degrees in radians=",math.pi)'),'ROS常用弧度；转换单位只是第一步，尚未解决旋转约定。','quaternion frame extrinsics','把三个角度直接相加能代替任意旋转组合吗？','不能。一般应按约定使用旋转矩阵或四元数组合，再需要时转回欧拉角。');
G('mavlink','MAVLink是消息协议，定义心跳、状态、测量、命令等数据的编码与身份字段。它可通过串口或UDP等链路传输，不等同于某一种物理线缆。|msgid表示消息种类，system/component表示发送身份，消息内部还可能有独立传感器ID。通信可达也不代表消息内容或控制条件有效。','程序构造协议消息|链路按配置发送与接收|接收者解析身份和消息语义','DISTANCE_SENSOR的msgid是132，同一种消息内的sensor id还区分逻辑来源；132不是某颗硬件的编号。','mavlink status','在PX4控制台观察实例、链路和统计，不更改流配置；QGC与MAVROS可能连接不同实例。','mavros uorb instance','QGC收到测距消息，能证明MAVROS那条链路也收到吗？','不能。两条链路的发送配置、带宽和接收状态可能不同，要查同一链路。','PX4 console');
G('mavros','MAVROS把MAVLink与ROS话题、服务和参数组织起来，插件处理不同功能。ROS输入、ROS输出和服务接口有不同方向。|它负责通信适配而不是PX4内部稳定控制，也不会自动驱动所有接到计算机上的相机或雷达。真实设备可能直接由自己的ROS驱动发布。','建立到目标飞控的链路|插件解析或构造MAVLink消息|ROS程序订阅状态或发送受支持请求','IMU链路通常是飞控测量→MAVLink→插件→ROS；vision_pose等接口则可能是ROS→飞控。只按话题名字容易看反方向。',rosCode('ros2 pkg prefix mavros\nros2 node list\nros2 topic list -t'),'包存在、节点运行与有实际数据是三件事，逐层检查。','mavlink plugin fcu','接上USB摄像头，它一定出现在MAVROS话题里吗？','不会。普通图像通常走相机驱动；是否转发外部定位给飞控是另外的接口设计。');
G('uorb','uORB是PX4内部的发布/订阅机制，驱动、估计、控制等模块通过它交换结构化消息。它与ROS话题属于不同系统。|内部消息要对外出现，还需要对应MAVLink stream或DDS配置及映射，不保证全部消息都默认发出，也不保证名字一一相同。','驱动或模块生成内部消息|PX4模块订阅与处理|配置的对外接口选择并转换其中一部分','distance_sensor在内部更新，只证明飞控有测量；ROS端还需逐层查发送、插件与消息映射。','uorb top','在PX4控制台观察实际内部消息及更新率；按Ctrl+C退出后再执行listener查询。','mavlink dds publisher','uORB有数据但ROS没有，先改传感器接线一定有用吗？','不一定。既然内部测量已有，要继续查对外发送与桥接层。','PX4 console');
G('plugin','插件是在主程序中负责某类功能的模块。MAVROS插件可注册订阅、发布或服务，并解释特定MAVLink消息。|插件加载、配置匹配、实际收到数据是连续但不同的条件。插件名也不是硬件商品名。','主程序按允许/禁用配置加载|插件建立端点与消息处理|收到匹配数据才生成对应输出','distance_sensor被禁用时，链路仍可能收到DISTANCE_SENSOR；另一光流插件也可能根据自己的消息发布距离，不能一概而论。',rosCode('ros2 param list'),'先发现实际MAVROS节点参数，再查plugin_denylist/allowlist；配置名称以安装版本为准。','mavros raw instance','修改默认插件文件，能证明运行实例已经改了吗？','不能。运行实例可能读本地副本、被启动参数覆盖，或尚未重启。');
G('fcu','FCU承担飞控职责，运行传感器读取、状态估计、模式管理、控制和执行器输出等。实体设备是一块飞控板，SITL则可在普通计算机中运行同类软件逻辑。|伴随计算机运行ROS、定位或规划，两种职责可以分布在不同硬件上；仿真时也可以是同机的不同进程。','传感器观测进入飞控|估计与控制产生执行器需求|执行器和运动形成反馈','规划器只给出未来目标；PX4仍根据实际状态与模式完成相应控制。ROS掉线后的动作由飞控条件和配置决定。','ver all\ncommander status','在实际PX4控制台核对固件与当前模式，不以板卡品牌猜接口。','ekf offboard sitl','有一台运行ROS的计算机，就等于有完整飞控闭环了吗？','不等于。还需明确估计、模式、控制、执行器以及反馈由谁实现。','PX4 console');
G('qgc','QGroundControl是地面站，用于连接、显示、配置、任务和日志等交互。它通常通过自己的MAVLink链路与飞控通信。|地面站显示正常只能说明其链路与所看数据的状态，不能代替另一条MAVROS/DDS链路的验证。版本和界面功能也需要与实际安装对应。','建立地面站连接|查看仪表、状态、参数与消息|发出操作后观察实际结果和日志','MAVLink Inspector看消息，Console执行飞控查询；它们既不是Linux Shell，也不是ROS图查询工具。','ver all','此命令只在QGC的MAVLink Console或PX4控制台执行，核对连接的固件实例。','mavlink fcu rviz','QGC窗口关掉，PX4内部姿态控制也一定停吗？','不会因此必然停止。内部控制由飞控执行，外部链路丢失的实际处理取决于模式和配置。','PX4 console');
G('ekf','EKF以模型预测状态，再用带不确定性的观测纠正预测。PX4的EKF2估计位置、速度、姿态和相关偏置等，具体输入取决于配置与有效性。|收到传感器数据、允许某来源融合、当前实际融合以及估计结果有效，是不同证据。创新、协方差与故障状态有助于判断是否可信。','IMU与模型预测运动|对齐时间和坐标后比较观测残差|按不确定性更新并判断状态有效性','视觉给的位置偏到另一坐标系时，消息可能送达，但创新很大、被拒绝或引起异常；增加发送频率不能修复语义错误。','ekf2 status','在PX4控制台查看当前实现的状态，再按同版本文档和日志检查融合与创新。','covariance imu vio','打开外部视觉融合参数，就能证明它正在被用吗？','不能。还要有有效输入、时空对齐与当前融合/创新证据。','PX4 console');
G('covariance','协方差矩阵描述误差的波动及不同分量的相关性。对角元素是方差，非对角元素表达关联；数值还带对应物理单位的乘积。|它是估计模型的一部分，不是随便填一个越小越好的“信任度”。消息对零、未知或无效值的约定还要单独查看。','定义误差与表达坐标系|由噪声模型或样本估计矩阵|估计器结合残差与协方差分配权重','位置x标准差0.1m，对应方差0.01m²；把标准差0.1直接填进方差字段会改变模型。',pythonCode('sigma=.1\nvariance=sigma**2\nprint("std_m=",sigma,"variance_m2=",variance)'),'方差约0.01m²。真实矩阵还需考虑其他轴和相关性，此例不产生完整飞行估计配置。','ekf message frame','把所有协方差填零就代表最准确吗？','不一定，甚至可能表示未知或违反接口约定。按消息定义和实测噪声建模。');
G('offboard','Offboard让外部程序持续提供受支持控制目标，飞控根据目标层级、估计有效性和模式条件执行。它不是“发一条坐标就自动飞过去”的接口。|以PX4 v1.16为例，外部存活输入需超过2Hz，进入前持续超过1秒，并满足其他条件；MAVLink目标流与直接DDS的OffboardControlMode具有不同职责。','准备有效状态与目标流|请求进入并确认实际模式|持续更新并处理取消、失联与估计无效','MAVROS位置目标会走协议与模式链路，PX4仍执行控制；直接DDS路线的坐标、消息与存活输入不能照搬MAVROS设置。','commander status\nparam show COM_OF_LOSS_T','在PX4控制台只读核对实际模式和失联超时配置；不解锁、不切模式。','setpoint fcu hz','目标流够快，为什么仍可能被拒绝进入Offboard？','频率只是条件之一，还要检查估计、目标层级、实际模式与拒绝日志。','PX4 console');
G('setpoint','目标值表达希望系统达到或跟踪的状态，如位置、速度、姿态或角速度。它与传感器观测和当前估计状态方向不同。|控制层级越低，需要外部程序承担的责任通常越多。先弄清支持字段、坐标、单位、时刻与有效区间，再发送。','任务或轨迹产生希望状态|接口按选定层级传给控制器|控制器比较目标与实际并产生输出','“到x=1,y=2,z=1.5”是位置目标；当前位置可能仍是原点，必须看实际反馈判断是否到达。',rosCode('ros2 interface show geometry_msgs/msg/PoseStamped'),'只看目标消息结构；是否受支持、字段与坐标怎样解释，另按接收接口核对。','trajectory offboard ekf','目标等于当前估计时，飞机一定不动吗？','不一定。还取决于速度、控制器状态、估计变化、风和执行器等，不只是一组位置数字。');
G('sitl','SITL把飞控软件作为普通计算机进程运行，仿真器为它提供虚拟测量并接收执行器等输出。它能验证大量软件逻辑，不要求实体飞控板。|只打开Gazebo模型还没有证明飞控闭环；还要有PX4进程、正确模型绑定、传感器输入与实际状态。','仿真器推进动力学与传感器|飞控软件估计和控制|输出回到仿真器形成闭环','默认x500启动后同时看到Gazebo飞机与pxh>；在QGC观察到同一实例，再比较姿态和定位。','ver all\nlistener vehicle_attitude 1','在SITL的PX4控制台核对版本与姿态；不是Linux的通用命令。','gazebo fcu sdf','SITL起飞成功，可以直接认为实机也就绪吗？','不能。真实驱动、标定、时延、供电、执行器与环境仍需相应验证。','PX4 console');
G('gazebo','Gazebo构建虚拟世界，通过物理系统模拟刚体、关节、碰撞，并用传感器系统生成图像、点云等。模型文件与插件共同决定功能。|Gazebo不是ROS，也不是PX4；可以通过桥或专用集成连接它们。Classic、Fortress与Harmonic等软件组合的命令和插件并不通用。','SDF描述场景与模型|系统插件推进物理、控制和传感器|外部程序经接口发送与读取数据','本课双轮小车接Twist后运动，发零速度后停止；PX4飞机还要另一套飞控联动。', 'command -v ign\ncommand -v gz\nls /opt/ros','先确认实际工具与ROS环境，再选课程里的Humble/Fortress或Jazzy/Harmonic代码。','sitl sdf rviz','Gazebo看见地面，为什么物体还可能穿过去？','显示visual与物理collision分开；缺collision或物理插件时，画面不是物理约束的证明。');
G('rviz','RViz订阅ROS消息，把图像、点云、路径和TF等显示出来，用于理解空间关系与诊断数据。它通常不负责物理模拟。|Fixed Frame、时间、TF连通性与显示插件配置会影响结果。看不到数据时，要分清没有发布、变换失败和可视化设置错误。','选择固定参考系|接收消息并查询对应变换|显示几何与状态供人检查','一片点云在相机系下可见，在map系下报No transform，说明输入可能正常但变换链还没连通。',rosCode('ros2 pkg executables rviz2'),'核对显示工具已安装；在图形环境运行rviz2，按实际数据选择显示项与Fixed Frame。','tf frame gazebo','RViz里模型移动，能证明用了真实飞行动力学吗？','不能。它显示输入数据；数据也可能来自简化模型、录包或直接位置变换。');
G('dds','DDS提供数据分发、发现与QoS等机制，ROS 2通常通过RMW实现接入。uXRCE-DDS为资源受限端提供客户端/Agent方式，不能与完整DDS进程简单混同。|PX4的直接ROS 2路线把配置的uORB消息接到/fmu接口；MAVROS走MAVLink适配，两条路线的消息、坐标和存活要求要分别理解。','选定RMW与发现环境|Agent/client按配置连通受限端|匹配消息定义并建立具体输入输出','Agent运行不意味着每个uORB消息都暴露给ROS；仍需检查dds_topics配置、消息版本与实际/fmu端点。','printf "RMW=%s\\nDOMAIN=%s\\n" "$RMW_IMPLEMENTATION" "$ROS_DOMAIN_ID"','这里只记录本进程环境；还需核对Agent、client与端点，不会启动它们。','domain qos uorb','Agent与MAVROS必须首尾串联使用吗？','不需要。它们属于不同接入路线，按任务选择并明确接口，不能假设会自动互相转换。');
G('vio','视觉惯性里程计把图像约束与IMU运动预测结合，估计位姿、速度和偏置等。它的输出依赖内参、外参、时间、噪声模型和可观测运动。|普通单目相机能采图，不代表已经具备VIO。纯单目视觉还常存在尺度不确定性，不能把随意的IMU流拼进去获得可靠米制位置。','同步图像与IMU输入|视觉跟踪与惯性预测共同约束状态|输出位姿及质量，并监测失跟踪','先复现EuRoC配套数据；换自己相机时逐项替换K/D、相机—IMU关系与时间差，而不是只改话题名。',rosCode('ros2 topic find sensor_msgs/msg/Image\nros2 topic find sensor_msgs/msg/Imu'),'知道当前图里有没有两类候选输入；存在还需核对来源、频率、标定和时基。','intrinsics extrinsics imu','看到VIO的pose，PX4就已经融合它了吗？','没有。还需观测接口适配、坐标时间质量检查，以及飞控侧实际融合证据。');
G('slam','SLAM同时估计自身状态并构建环境表示，常包含前端匹配、局部估计与后端地图约束。不同系统是否有回环、重定位，要看具体实现。|里程计积累出一片点云不自动拥有完整SLAM能力。回环修正可能改善全局一致性，也可能改变全局坐标，需要与连续控制接口协调。','从新观测估计相对运动|把观测加入地图并建立约束|利用重复观测或回环修正累计误差','回到起点时后端拉齐轨迹，map到odom的关系可能改变；控制器若忽略这种重置会误读位置跳变。',rosCode('ros2 topic find nav_msgs/msg/Odometry\nros2 topic find nav_msgs/msg/Path'),'发现候选状态与轨迹，不凭话题类型认定算法具有回环；还需读实现与日志。','lio vio frame','输出PCD文件的定位器就一定有重定位吗？','不一定。保存地图、回环检测与加载地图重定位是不同能力。');
G('pointcloud','点云用大量三维点描述观测到的表面。PointCloud2包含字段布局、数据步长、尺寸和二进制数据，除了xyz还可能有强度、逐点时间或其他字段。|稀疏、遮挡、量程和噪声决定哪些表面被观测。没有点不一定意味着空闲空间，也可能根本没看见。','传感器采样并输出字段|按坐标和时间解释每个点|进行滤波、配准、建图或障碍处理','墙面点云在移动扫描中可能变弯，需要去畸变；把点云转为规划地图还要定义未知与机体膨胀。',rosCode('ros2 interface show sensor_msgs/msg/PointCloud2\nros2 topic find sensor_msgs/msg/PointCloud2'),'查看字段布局与实际来源；不要把整段data当成简单浮点数组直接读。','deskew lio frame','单点Range消息能直接当整片点云使用吗？','不能。测量结构和覆盖范围不同，需要明确几何与时刻，不能只改话题类型名。');
G('raw','raw表示相对后续处理较早的一层，不是全行业统一的“完全未处理”保证。驱动可能已经做单位换算、标定或坐标转换。|应沿实际代码和接口定义判断输入经过了什么，再决定后续是否还需要补偿，避免重复处理。','找到原始数据的定义|核对驱动与插件已做的处理|与后续估计或融合输出分层比较','IMU data_raw可能没有有效姿态，但角速度和加速度已经是标准单位；不能因为叫raw就再次从整数计数换算。',rosCode('ros2 interface show sensor_msgs/msg/Imu\nros2 topic list -t'),'找实际raw/data接口并查来源与字段，类型相同也可能表达不同处理阶段。','imu message plugin','名字里带raw，就能跳过标定和单位检查吗？','不能。必须看实际驱动、消息约定和配置。');
G('instance','实例号、device_id、MAVLink sensor id和ROS名字分别属于不同层的身份系统。它们可以建立映射，但不能仅凭数字相同认定来自同一硬件。|辨认来源需要型号、接线、发布节点、配置和可控变化等多条证据；融合输出可能不再对应单颗设备。','先记录物理设备与接口|逐层记录内部实例和协议身份|用配置与受控变化建立映射','MAVLink msgid=132表示DISTANCE_SENSOR种类，payload里的id=0区分逻辑来源，和uORB实例0不是天然相同的编号。','listener distance_sensor 1','在PX4控制台看实际字段；若需其他实例，先查本机listener帮助，不能从一次输出猜所有来源。','mavlink plugin pointcloud','两个传感器ID都写0，它们一定是同一颗吗？','不一定。身份还可能依赖发送system/component、链路和各层自己的编号规则。','PX4 console');
G('lio','激光惯性里程计结合雷达环境约束与IMU短时预测，估计运动并维护地图。IMU在扫描间提供运动信息，雷达帮助约束惯性漂移。|FasterLIO利用iVox等结构加速处理；它回答“我在哪里”，规划器回答“接下来往哪走”，两个模块不能相互代替。','读取匹配雷达和IMU|运动预测、去畸变与地图匹配|更新位姿、轨迹与点云表示','长走廊的几何可能难以约束某些运动方向；有连续输出仍应检查退化、时延和质量，而不是只看地图漂亮。',rosCode('ros2 topic find sensor_msgs/msg/PointCloud2\nros2 topic find sensor_msgs/msg/Imu'),'这只是ROS 2输入发现。FasterLIO原主分支使用ROS 1，完整例子需要选对应环境，不能直接混用。','imu deskew ivox','FasterLIO有地图了，就能让飞机自己绕障吗？','还需要规划器可用地图、目标、运动约束、轨迹执行与飞控闭环。');
G('deskew','扫描传感器在一段时间内依次取得不同点。机体移动时，这些点对应不同姿态；去畸变把它们补偿到统一参考时刻。|补偿通常需要逐点时间和运动估计，整帧header.stamp不足以描述所有点的采样时刻。时间单位或偏移错误也会导致几何扭曲。','保留每个点的采样时刻|估计扫描期间的运动|变换各点到同一时刻再匹配','2m/s移动扫描0.1秒，传感器平移约0.2m。把它当成一个瞬时点云可能让墙面变形；转动还会带来方向相关误差。',pythonCode('v=2.; duration=.1\nprint("translation_during_scan_m=",v*duration)\nprint("20ms_timing_error_m=",v*.02)'),'平移0.2m，20ms偏差约0.04m；这里只演示匀速平移，不是完整去畸变算法。','time pointcloud lio','把整帧时间改成当前时间就能拉直墙吗？','不能。仍需逐点时间、正确运动和外参；改标签会掩盖真实延迟。');
G('ivox','iVox用稀疏、增量的体素结构组织地图点，帮助在局部附近快速找匹配点。体素索引可先用坐标除以格子尺寸再向下取整理解。|体素大小和邻域选择影响计算量与约束质量，算法的近邻地图不等于规划器占据地图。未存点的格子不能直接解释成安全空间。','按空间位置求体素索引|只维护有观测的局部地图点|查询附近点形成几何约束','格子变大可能把更多点放进同一格，搜索与几何细节的取舍也变化；性能必须在具体传感器和计算机上测。',pythonCode('import math\nfor x in [-.1,.1,.6]:\n    print("x=",x,"voxel=",math.floor(x/.5))'),'0.5m格子下索引为-1、0、1；负数要向下取整，不能直接截断为0。','lio pointcloud esdf','iVox查不到点的位置，一定没有障碍吗？','不一定。可能未观测、稀疏或被裁剪，定位地图与通行空间要分别定义。');
G('esdf','欧氏符号距离场为位置记录到障碍表面的距离，符号与内外约定有关。规划器可利用距离和梯度构造远离障碍的约束。|EGO的ESDF-free表示避免构建完整ESDF，并非省去环境观测或碰撞判断。不同地图表示的未知空间规则也不同。','从传感器建立环境表示|计算或间接构造障碍距离约束|规划后再验证碰撞与运动可行性','如果障碍点在(1,0)，起点在(0,0)，距离1m只描述点到点关系；真实通行还需机体尺寸、误差、障碍表面与未知区域。',pythonCode('import math\nrobot=(0.,0.); obstacle=(1.,0.)\nd=math.dist(robot,obstacle)\nprint("point_distance_m=",d)\nprint("toy_margin_m=",d-.3)'),'点距离1m，减教学半径0.3m为0.7m；这不是完整ESDF或实际避障参数。','ivox bspline trajectory','不用ESDF的规划器，可以完全不读取地图吗？','不能据此推断。仍需按该算法设计提供障碍/环境信息并检查可行性。');
G('bspline','B样条用控制点、阶次和节点向量表示曲线，能计算位置及导数。控制点影响局部曲线形状，通常不是必须穿过的航点。|把曲线参数关联到时间后才能形成运动轨迹；光滑曲线也可能穿过障碍或超过速度、加速度限制。','控制点和节点向量定义曲线|优化平滑、碰撞与可行性约束|轨迹服务器按时间采样位置及导数','规划器移动控制点可以让路径绕障，但优化成功后仍要核对碰撞、时间区间、连续性和实际跟踪误差。',pythonCode('points=[0.,1.,3.]\nsecond_difference=points[0]-2*points[1]+points[2]\nprint("second_difference=",second_difference)'),'二阶差分为1，只用来理解弯曲/平滑量；不是完整B样条求值器。','trajectory esdf setpoint','控制点都在空闲区域，曲线就一定无碰撞吗？','不能只凭这一点判断。曲线、机体裕量和完整可行性需按具体算法验证。');
G('trajectory','轨迹把状态和时间关联起来，通常包含位置、速度、加速度等。路径只说明从哪里经过，不能单独决定什么时候怎样运动。|同一几何路线用一半时间完成，速度、加速度和jerk需求会按不同幂次增大。执行还需有效时间、控制接口与反馈。','根据地图和目标规划运动|为曲线分配时间并检查约束|按当前时刻取目标并与实际状态比较','沿相同曲线把持续时间从4秒改为2秒，可能要求速度2倍、加速度4倍、jerk8倍；这不是简单加快动画。',pythonCode('scale=.5\nprint("velocity_factor=",1/scale)\nprint("acceleration_factor=",1/scale**2)\nprint("jerk_factor=",1/scale**3)'),'得到2、4、8；真实系统还需要检查极限、延迟和衔接。','bspline setpoint time','拿到轨迹后只发送最后一个位置点可以等价执行吗？','不能。会丢失时间、路径与动态约束信息，必须按所选执行层级明确设计。');
G('swarm','多机协同让多台机器人根据各自状态和交换的信息协调运动。EGO-Swarm中各机本地规划，同时考虑邻机未来轨迹等信息。|身份隔离、公共坐标、时间与通信有效性是不同问题。分布式不等于不通信，异步也不等于可以忽略时间戳。','本机收集状态和环境|接收对齐且新鲜的邻机轨迹|预测冲突、重新规划并分享本机计划','两架机当前相距2m，各以1m/s相向，1秒后可能相遇；只看当前距离会漏掉未来冲突，旧邻机数据也不能当成邻机消失。',pythonCode('initial_distance=2.; closing_speed=2.\nprint("meet_after_s=",initial_distance/closing_speed)'),'匀速直线教学模型1秒相遇；真实曲线要考虑时效、机体与连续时间检查。','namespace frame trajectory','不同drone_id能自动把各机LIO原点对齐吗？','不能。ID只是身份，公共定位与坐标变换需要独立建立并处理重置。');
G('intrinsics','内参描述相机的成像规则，常见针孔模型包含像素焦距fx/fy与主点cx/cy，组织成矩阵K。它与相机在机器人上的位置无关。|在已去畸变的理想投影里u=fx·X/Z+cx、v=fy·Y/Z+cy。焦距的像素数、图像分辨率与坐标约定都要匹配，不能把网上参数直接套给自己的镜头。','用已知几何采集多姿态图像|估计投影参数与畸变|按同一图像配置加载并验证','fx=500像素、cx=320时，前方Z=2m、右偏X=0.2m投到u=370。X/Z相同的不同深度也投到同一像素，所以内参不会自动提供米制深度。',pythonCode('fx=500.; cx=320.\nfor X,Z in [(.2,2.),(.4,4.)]:\n    print("X,Z=",X,Z,"pixel_u=",fx*X/Z+cx)'),'两种深度都得到370像素。完整交互图可从相机内参课程打开。','extrinsics distortion message','裁剪或缩放图片以后，原来的K还能直接用吗？','要重新核对。像素坐标的比例与主点可能变化，驱动/处理链可能相应调整参数，也可能需要重新标定。');
G('extrinsics','外参是两个坐标系之间的刚体关系，包括旋转R和平移t。必须标清方向，例如R_body_camera把相机表达的向量转换到机体表达。|p_body=R_body_camera·p_camera+t_body_camera。t表示相机原点在机体系的位置；反向转换需要正确求逆，不能只把所有数取负。','先确定两个原点与轴|测量或标定相对旋转和平移|用已知方向验证变换与时间关系','相机光学z向前，而机体x常向前，安装对齐时也可能需要固定轴旋转。镜头内参标定不会自动产生这组安装关系。',pythonCode('camera=(.2,.1,2.)\nrotated=(camera[2],-camera[0],-camera[1])\nt=(.1,0.,.05)\nprint("body=",tuple(a+b for a,b in zip(rotated,t)))'),'在此示意安装假设下约(2.1,-0.2,-0.05)m；实际R/t必须来自你的装置。','intrinsics tf frame','固定相机—IMU在同一支架上，就不需要外参标定了吗？','固定只表示关系不随时间自由变化，不代表数值已知；VIO还需按算法要求处理时间偏差。');
G('distortion','畸变描述真实镜头相对理想投影的偏离，常见径向和切向模型通过一组系数D表示。不同镜头模型不能随意混用同一参数形式。|标定后可把原始图像重采样为更符合目标投影的图像。去畸变会改变有效视场或像素映射，但不会制造额外深度。','用清晰、多姿态棋盘样本约束模型|估计K与对应模型的D|显示校正图并核对直线和分辨率','门框靠近广角画面边缘时可能弯曲，标定与rectify后可检查是否改善；只看重投影误差一个数字还不够。',rosCode('ros2 interface show sensor_msgs/msg/CameraInfo'),'查看distortion_model与D字段，再对照实际输出；内参K和畸变D不是同一数组。','intrinsics extrinsics pointcloud','去畸变后就能直接把一张图转成可靠点云吗？','不能。点云还需要深度或其他几何约束、坐标和时间关系。');
G('sdf','SDF是描述仿真世界和模型的XML格式，可写地面、灯光、刚体、关节、碰撞、惯性、传感器和系统插件。Gazebo解析后按这些定义构建系统。|文件能解析不代表所有插件或物理行为都正确；还要实际加载、观察运动和接口。不同Gazebo版本的插件命名也要匹配。','解析world与model层级|创建link、joint及系统插件|推进物理和传感器并检查实际结果','小车文件中visual让你看见轮子，collision决定接触，joint允许转动，DiffDrive才把Twist变成轮速；任何一层都不能仅靠画面推断。','command -v gz\ncommand -v ign','根据实际发行版选择课程生成的完整文件，再使用匹配的SDF检查工具。Harmonic可运行gz sdf -k 实际文件路径。','gazebo sitl plugin','只删掉collision保留visual，小车外观还可能正常吗？','可能仍看起来正常，但碰撞/接地行为会改变；仿真外观和物理模型必须分别验证。');

A('sensor-mount','打开姿态显示',['回QGC的Fly飞行视图，找到人工地平仪和朝向/航向显示。','把未运行电机的机体水平静置；先等数据稳定，再记下地平线和俯仰/横滚数值。','此节是地面传感器数据观察，不解锁、不启用执行器测试。'],'QGC Fly页；机体静止地面观察');
A('sensor-mount','逐轴小幅',['保持电机不运行，只绕一个方向轻微转动：先抬机头、停住观察，再恢复水平。','然后向右小幅侧倾，观察横滚变化，再恢复水平。一次只改变一个轴。','记下“实际动作→显示变化→恢复后读数”；若显示轴互换，查飞控安装方向，先不改参数。']);
A('hardware-baseline','保存飞控参数',['QGC左上主菜单 → Vehicle Setup → Parameters（参数）。等待参数下载完成，不在下载未完成时保存半份结果。','在Parameters页打开Tools（工具），选择Save to file/保存到文件，选一个你能找到的目录。','文件名写明日期、固件版本和实例，例如sitl-baseline-20261112.params；保存后在文件管理器确认存在。','再到MAVLink Console运行ver all，把输出与参数文件放进同一实验记录。'],'QGC参数页与文件管理器');
A('mavros','确定本次fcu_url',['先决定是实体串口还是SITL/网络：串口在运行MAVROS的主机列出/dev/serial/by-id/；网络在PX4控制台运行mavlink status。','串口格式示例serial:///实际设备路径:实际波特率，实际波特率来自该接口配置；示例中的921600不是所有设备的答案。','UDP的URL形式与绑定/远端方向先看本节MAVROS连接文档；把接收端口、PX4发送目标和system/component记在同一表里。','确认不是QGC常用GCS接收端口与伴随端口混淆，再进入下个询问Verified FCU URL的代码块。'],'Linux设备查询 + PX4控制台','本课不会从硬件型号自动猜连接参数；不明确的字段先记录为待查，不随意填一个能通过格式检查的值。');
A('lidar-cloud','检查并显示',['从上一步PointCloud2列表复制真实话题；使用ros2 topic info 实际话题 -v核对发布者。','在图形桌面启动rviz2，左侧Displays上方/下方点Add → By topic，选择真实PointCloud2话题；也可By display type → PointCloud2后填Topic。','展开该显示的Status，先看是否有消息，再看No transform等变换错误。Global Options → Fixed Frame填消息自身frame，先单独看输入。','点Add → TF或Axes查看坐标。要叠到地图/机体上，必须有真实TF链，不能只改frame_id字符串。'],'ROS图形桌面 → RViz Displays','黑屏先按F聚焦所选对象或调整视角；No transform先查TF和时间。');
A('slam','观察回环',['先打开算法配套RViz配置，显示估计Path、局部里程计和地图；保持同一段录包作对比。','对已有“返回起点”的录包，记下返回前后的map/odom变换与轨迹；不要在任意没有回环能力的LIO里寻找必然回环。','若轨迹出现修正，回日志查loop/relocalization/reset等事件并对应同一时刻；保存前后截图和配置。'],'算法配套RViz与回放日志');
A('viz','显示TF',['启动rviz2后，在Displays面板点Add，选By display type → TF → OK。','Global Options → Fixed Frame选实际已存在的参考系；展开TF → Frames查看哪些frame可用和是否报错。','再加Axes，Reference Frame选要检查的机体或相机frame，核对x/y/z颜色与实际方向。','No transform时先用tf2_echo查询真实父子名字，核对时刻，不能用发布一个虚构恒等变换掩盖问题。'],'ROS图形桌面 → RViz');
A('flight-logs','下载飞控日志',['记录本趟实验大致开始/结束时间；在QGC主菜单 → Analyze Tools → Log Download打开日志列表。','先刷新列表，对照时间、文件大小和所连接实例选择对应ULog，点Download并选择专用实验目录。','等待下载完成，再在文件管理器确认.ulg存在；把固件版本和同趟ROS bag路径写到目录内的说明文件。'],'QGC Log Download','列表为空时到PX4控制台logger status查记录器；本节不通过格式化存储来排错。');
A('flight-logs','对齐事件',['在QGC日志/飞控曲线中选一个明确事件，例如模式从Takeoff变Land；记录其飞控时间。','在同趟ROS数据中找/mavros/state对应mode变化，写下ROS时间。','先解释两侧时基和时间偏移，再比较位置/目标曲线；不要直接拿两个原始秒数相减。','用另一个事件交叉验证对齐，记录误差与仍不确定的时段。'],'日志分析工具与同趟ROS数据');
A('sim-real','记录初始状态',['保持机体静止且电机不运行，QGC Fly页记录模式、姿态、定位/Ready状态、电压和当前时间。','截图中保留实例信息；切到ROS终端确认是同一飞控链路，再执行下个消息查询。','如果没有实体飞控，可在已停桨的SITL状态做消息对照，但不要把模拟结果当成真实传感器验证。']);
A('sim-real','逐轴核对',['地面观察时电机不运行，先抬机头一次，再恢复；另一次只做侧倾，不同时改变多个轴。','观察QGC姿态与ROS四元数转换后角度的对应变化，记录时间与方向。','表达不同先查ENU/NED、FLU/FRD及MAVROS已做的转换，不能为了数值一致再重复旋转。']);
A('containers','检查目标容器',['先运行docker ps得到真正运行中的容器名，不把镜像名当容器名。','用docker inspect 实际容器名查看NetworkMode、设备映射与挂载；这里只读取配置。','确认/dev/video、串口或GPU是否映射进容器，容器中的ROS发行版与依赖是什么。宿主能运行不等于容器里具备。'],'宿主Linux终端，不是先进入容器内部');
A('services','定位具体服务',['从systemctl输出复制真实服务单元名，保留.service后缀。','先用systemctl status 实际单元 --no-pager查看当前状态，再用journalctl -u 实际单元 -n 80 --no-pager读最近日志。','核对ExecStart的程序、工作目录与加载环境；先保存报错，不反复restart。'],'管理该服务的Linux主机终端');
A('sensor-discovery','先画清接线',['拿纸画传感器到接收端的真实线：USB/CSI接计算机，还是UART/CAN/I²C接飞控。写型号与接口。','接计算机先找厂商ROS驱动，接PX4则查驱动/uORB/MAVLink/插件，不先按商品名搜索MAVROS。','每层留一格“实际发现的消息/端点”，后面每个查询只补一个已确认的证据。']);
A('sensor-discovery','确认实例与有效值',['在本次飞控控制台运行listener distance_sensor 3，若不是测距从类型对照表选正确uORB候选。','逐条记device_id、timestamp、距离、方向、min/max；检查消息是否更新，值是否在合理范围。','查看其他实例前先输入listener读本机用法，再按实际instance参数查；实例号不自动等于MAVLink sensor id。'],'PX4的pxh>/nsh>或QGC Console');
A('sensor-discovery','对一个候选话题',['从发现列表复制真实话题，在ROS终端运行ros2 topic info 实际话题 -v，确认MAVROS是发布方还是订阅方。','再用timeout 8s ros2 topic echo 实际话题 --qos-profile sensor_data --once读一条，按消息类型解释单位。','测距可在电机不运行的地面环境改变靶板距离，对照同一逻辑ID的值是否同时变化；一次只改变一项。','记录设备→uORB身份→MAVLink身份→插件配置→ROS话题与frame，不能以“有数值”结束来源判断。']);
A('lio-input','先对照接口表',['打开当前雷达驱动README与算法config，分别抄出雷达型号、消息类型、逐点时间单位和IMU来源。','对照真实录包/话题info，确认自定义Livox消息和PointCloud2哪一种进入算法。','再记相机无关的雷达—IMU外参、时间同步方式和配置文件路径；未知字段先保留待查。']);
A('lio-replay','下载对应数据',['打开本页末尾FasterLIO官方仓库链接，README中找到Prepare the datasets及可用的新数据来源。','先选一种数据：AVIA包对应avia.yaml，NCLT/旋转雷达对应其配置；下载后记绝对路径和文件哈希。','下一步先运行rosbag info看话题与类型，再决定使用哪个launch；不要因文件名包含lidar就套AVIA。']);
A('ego-build','先检查环境',['在将要编译的终端运行cat /etc/os-release、uname -m、ls /opt/ros，写明系统和CPU架构。','打开官方ros2_version分支，确认不是master的catkin命令。','新开只加载Humble的终端，不source Noetic；然后按后续完整构建段从独立工作空间开始。']);
A('ego-run','先理解仿真级别',['在单机启动命令中找到use_dynamic参数，先保持False运行简化模型。','记录实际启动入口和参数；False会按简化规则把目标变成里程计，尚未运行PX4。','完成一次输入输出检查后停旧实例，再用True跑同一场景，才比较动态响应。']);
A('ego-run','比较失败与模型变化',['在源码里定位single_run_in_sim.launch.py，先复制到独立实验目录并保留原文件，不直接覆盖官方参数。','记录预设航点、地图种子和use_dynamic；先跑原例，保存目标与状态话题，再改变一个输入。','关掉旧仿真后只把use_dynamic从False改True运行，比较相同地图、起终点和最坏耗时。','需要交互目标时先核对flight_type和实际订阅话题，不假设RViz任意2D Nav Goal都能驱动该配置。']);
A('ego-px4','写出接口约定',['在文本文件建字段表：规划frame、机体参考点、PositionCommand各字段与单位、轨迹开始/结束时刻。','用ros2 interface show quadrotor_msgs/msg/PositionCommand与目标MAVROS/DDS消息定义逐字段对照。','明确一个适配节点只处理这一组转换，另有任务状态机决定何时接受、取消、保持或拒绝；未实现项标注未实现。','先给已知轴、单位、过期时间和无效输入写离线样例，之后才连接SITL。'],'接口设计和独立适配节点开发','该项目的PositionCommand不能只改话题名当成PoseStamped；尚未实现适配时不会凭本文自动生成飞行程序。');
A('ego-px4','分四次做SITL验收',['先完成QGC模拟起降和MAVROS只读状态基线，保存同趟数据。','第1次用已验证适配节点的固定目标；第2次慢速轨迹；第3次测试轨迹衔接；每次都对照实际位置和模式，不一次全开。','第4次在SITL中停止规划输入或使定位过期，记录任务节点状态与飞控模式；恢复时必须重新核对有效性。','适配尚未实现时先停在接口设计与已有算法仿真，记录待开发项，不能声称已完成PX4联调。']);
A('swarm-run','先写每架机',['打开官方swarm.launch.py，逐项写下drone_configs中的drone_id、init位置、目标和use_dynamic。','启动后用topic list -t和node list对照实际名字，把每架机的Odometry、Bspline、PositionCommand写到同一行。','另记邻机广播的时间和参考系；不同ID不证明坐标已对齐。开始先用官方默认机数，改规模需要保留launch副本。']);
A('gazebo','看懂这条路线',['在本课顶部读world/model/link/joint四个名词，点术语按钮可展开完整定义。','使用本页末尾“下一节”进入方块世界，先运行生成文件代码，再运行启动代码；本节不需要提前找网上模型。','每节只保留它要求的终端与世界，旧世界Ctrl+C停掉后再启动下一种世界。']);
A('gazebo','先解决显示',['在实际图形桌面打开终端，执行当前选择版本的--versions命令，确认程序存在。','直接Linux桌面应能打开GUI；在WSL先确认WSLg可用，在容器先按其图形映射方案配置。','看到cannot connect to display先解决显示；遇到GPU/渲染错误才尝试对应官方排查或软件渲染，不把开CPU渲染当常规性能方案。']);
A('sim-world','暂停、恢复',['在Gazebo实体树找到falling_box，点选它，再在组件/实体检查器找到Pose。若不在视野，选中后使用界面聚焦/跟随功能。','运行时方块从中心z=2下降到约0.2；点击底部播放/暂停控件，暂停后再次读Pose，数值应停止推进。','恢复播放后观察后续变化；地面不动、方块不穿地，才能说明碰撞与物理基本生效。']);
A('sim-robot','对照模型字段',['按生成器打印的绝对路径，用文本编辑器打开robot-fortress.sdf或robot-harmonic.sdf。','用编辑器查找left_joint、right_joint：两者分别连接body与左右轮，轴为模型y方向。','再查wheel_radius、wheel_separation与topic，对照车轮几何与控制频道；只读完再继续发送速度。']);
A('sim-drive','中途Ctrl+C',['先看当前代码块最后一行，它发布linear.x=0、angular.z=0。','若前进命令被你Ctrl+C中断，单独复制并执行这条零速度命令，等待观察小车停止，再结束观察工具。','若找不到正确命令或终端报错，先点Gazebo暂停，回查当前Fortress/Harmonic版本与/learn/cmd_vel，不关掉整个系统掩盖残留目标。']);
A('sim-bridge','判断问题',['先执行上一节Gazebo原生命令：小车能动说明物理/插件输入至少基本正常。','ROS命令无效时，在ROS终端查topic info /learn/cmd_vel -v是否有桥订阅端，再看桥日志中的消息类型和方向。','记录当前代码组合、命名空间、域和话题；一次只修一层，再用相同速度/停止步骤复测。']);
A('sim-sensor','怎样换成真实',['先在图像查看器确认/learn/camera真的有图，然后关闭本次查看器与桥，停止模拟世界。','点击本课程下一条真实相机路线，从识别设备开始；驱动会替代模拟相机输入。','后续仍按Image类型、实际话题、CameraInfo、频率和时间逐项核对，不让算法猜测图像来源。']);
A('sitl','打开QGroundControl',['保留终端A的make ... gz_x500进程和Gazebo窗口，不要把pxh>当成另一个缺失应用。','点击下一节“第一趟仿真飞行”，从第1步打开QGC开始，那里给出下载入口、Fly视图和连接检查。','连接后先核对状态，再按起飞—确认—观察—降落操作，后续课程暂不要求启动MAVROS。']);
A('sim-observe','从SITL确认',['点回终端A，在本次SITL的pxh>输入mavlink status回车，保存面向伴随计算机的实例信息。','记录system/component ID、传输类型、端口、目标地址，与GCS链路分开。','在本页相关主题打开“使用实际接口启动MAVROS”，按真实值填URL；连好后回本页运行ROS状态查询。']);
A('sim-observe','接下来学什么',['先确认本节bag info有实际消息，写下bag目录和本次启动命令。','从知识库依次打开Offboard、任务状态机、轨迹跟踪；先在SITL有固定目标和反馈，再接复杂规划。','把还没有实现的适配节点和异常恢复单独列为待开发，不把能看到状态当成已完成自主控制。']);
A('camera-connect','选设备路线',['看相机铭牌/厂商页面，记型号和USB、CSI或网口；设备有IMU/深度能力也要以规格为准。','普通USB UVC继续v4l2查询；CSI或专用双目/深度设备先按厂商驱动运行原始图像例子。','确认设备接在真正运行驱动的Linux环境；WSL/容器先处理透传。没有相机时先用模拟相机例子。']);
A('camera-connect','设备不存在或被占用',['v4l2-ctl --list-devices没有目标时，先看lsusb是否出现，再看线缆/供电和宿主/客体归属。','有设备但无法打开时，关闭摄像头预览、视频会议或另一个驱动实例，再重新执行能力查询。','权限错误时用ls -l 实际设备和id比较所属组，按系统规则加组后重新登录，不用把设备设成全员可写。']);
A('camera-driver','保持单一驱动',['终端A保持v4l2_camera_node运行；在终端B图像窗口关闭后，A不应退出。','标定、特征与录包课程都新开终端加载ROS，再订阅A输出的同一真实话题。','最后结束实验时，先Ctrl+C停算法/录包/显示器，再Ctrl+C停驱动。若拔插相机，重新确认设备路径。']);
A('camera-model','先认单位',['先看本页投影图：蓝点是图像上的像素位置，不是机器人在世界中的点。','把Z保持2m，调X向右，观察u变大；再把X固定、Z调大，蓝点靠向主点。','读下方输出式，把fx、X、Z、cx和u的单位分别写出来；接着运行离线计算验证。']);
A('camera-model','为什么还要标定',['在真实图像查看器里看一条直门框，先观察中心，再观察靠边时是否弯曲。','记当前分辨率、裁剪、镜头焦距/对焦模式。参数变化后不能默认旧标定仍适用。','接下来先读外参，然后进入棋盘标定，使用自己的样本估计K/D，再显示image_rect比较。']);
A('camera-extrinsics','画出相机',['在纸上画相机光心、机体原点和地图原点，每个原点旁画x/y/z箭头。','按课程例子标光学系右/下/前、机体系前/左/上，写R_body_camera为“相机到机体”。','在平移t旁写“相机原点在机体系的位置，单位米”，再用下一步数值例子检验，不把教学安装值写到真机配置。']);
A('camera-extrinsics','相机—IMU',['先在设备规格里确认是否真的有IMU；Image消息存在不表示有IMU数据。','有IMU时列出图像/IMU真实话题、采样率和时间来源，再按算法说明准备相机—IMU标定数据。','目前只拍了棋盘得到K/D时，记录为“成像标定完成，时空外参待验证”，先用EuRoC配套输入学VIO。']);
A('calibration','数内角点',['在棋盘上数黑白格相交的内部交点，边缘格子的外角不计入；8×6内角点通常要9×7方格。','用尺量一格实际边长，25mm要填0.025m，不以打印页面标注尺寸代替测量。','棋盘固定在平板上，关打印缩放；在相机原图中检查完整、清晰和没有反光，再启动标定工具。']);

A('camera-features','主动做两组',['保持驱动与Feature movement窗口，先对准有纹理的静止墙面，缓慢左右移动相机，观察黄色点和绿色短线。','把相机转到白墙，再返回纹理墙面；对比特征数量与稳定性。另做一次较快移动，观察模糊与跟踪丢失。','记录光照、移动方式和现象；这些线是像素位移，不是已经得到米制机体轨迹。']);
