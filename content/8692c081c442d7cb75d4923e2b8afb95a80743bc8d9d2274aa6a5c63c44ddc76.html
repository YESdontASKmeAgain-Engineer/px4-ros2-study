<script>
'use strict';
const topic=(id,name,description,points,practice,accept,pitfall)=>({id,name,description,points:points.split('|'),practice,accept,pitfall});
const moduleInfo=(id,name,short,color,level,prerequisites,goal,project,topics)=>({id,name,short,color,level,prerequisites,goal,project,topics});
const curriculum=[
moduleInfo('base','Linux 与开发环境','先能定位环境和设备问题','#5472a7','基础',[],'独立检查系统、进程、连接和软件环境。','制作一份香橙派环境清单，记录系统、CPU 架构、ROS 版本和飞控设备路径。',[
 topic('linux-files','目录、文件与权限','理解程序在哪里、谁可以访问它。','绝对路径、相对路径、~ 与当前工作目录|所有者、用户组、读写执行权限和符号链接|普通用户与 sudo 的环境可能不同','用 ls -l 和 readlink 检查一个脚本与串口设备。','能解释 Permission denied 对应的具体权限。','不要用 chmod 777 代替查清权限。'),
 topic('linux-process','进程与服务','区分程序文件、运行进程和后台服务。','ps、pgrep、top、systemctl 与 journalctl|前台、后台、终端关闭与进程退出|SIGINT 正常退出、退出码与日志位置','启动并停止自己的 ROS 节点，记录 PID 和退出码。','能判断节点是没启动、已退出还是仍在等待数据。','重启 ros2 daemon 不会启动 MAVROS。'),
 topic('linux-network','网络与 SSH','让多设备通信可检查、可解释。','IP、子网、路由、DNS 与网络接口|TCP、UDP、端口和多播的区别|SSH 密钥登录、scp 传文件与端口占用','用 ip、ping、ss 检查香橙派和电脑的网络。','能区分主机可达与应用端口可用。','ping 通不能证明 DDS 发现正常。'),
 topic('linux-env','Shell 与环境变量','知道终端为什么找不到命令或包。','PATH、环境继承、export 与 source|.bashrc、登录 Shell 与非交互 Shell|ROS underlay、overlay 和 source 顺序','对比新终端 source 工作空间前后的包查找结果。','能说明两个终端为何看到不同 ROS 包。','进入目录不等于加载该工作空间。'),
 topic('linux-arch','ARM64 与 x86-64','理解电脑构建结果为何不能直接复制到香橙派运行。','源码通常可移植，机器码依赖架构|file、uname -m、动态链接与 ABI|原生编译与交叉编译的工具链差异','在香橙派重建一个 C++ 包并用 file 查看架构。','生成 ARM aarch64 程序且能启动。','复制 build/install 可能带入旧路径和错误架构。'),
 topic('linux-tools','Git 与依赖管理','保存能够复现的代码和依赖组合。','clone、branch、diff、commit 与版本标签|Git submodule、rosdep、apt 和 Python 环境|源码修改、配置修改与生成文件分开管理','记录项目提交、子模块版本和 ROS 依赖。','换目录后能按记录重建项目。','不要在系统 Python 中随意 sudo pip。'),
 topic('linux-debug','调试与故障分层','从可复现证据缩小问题范围。','完整命令、工作目录、环境和完整报错|编译错误、链接错误、运行错误、通信错误|gdb 回溯、日志级别和最小复现','把一个失败命令整理成可重复的最小案例。','别人按同样步骤能复现或验证修复。','只看最后一行报错可能漏掉根因。'),
 topic('linux-time','系统时间与资源','计算机状态会影响控制与测量。','墙上时间、单调时钟和设备启动时间|chrony/NTP、CPU 占用、内存与磁盘空间|温度、频率限制、供电和实时性','记录运行感知算法前后的 CPU、温度和延迟。','能识别资源不足造成的掉帧和超时。','修改墙上时间不等于完成传感器时间同步。')
]),
moduleInfo('coding','Python / C++ 与构建','写出能维护和调试的节点','#597ea3','基础',['base'],'掌握 ROS 节点所需的语言、并发和构建方法。','写一个带参数、定时输出和正常退出机制的 C++ 遥测节点。',[
 topic('cpp-basics','C++ 基础与类型','理解变量的值、类型与生命周期。','引用、指针、const、作用域和初始化|类、构造函数、成员变量和命名空间|整数宽度、浮点精度、单位与类型转换','把坐标和时间计算封装成独立函数。','能检查未初始化、越界和单位混用。','浮点数比较通常需要容差。'),
 topic('cpp-memory','所有权与 RAII','让资源随对象生命周期可靠释放。','栈、堆、unique_ptr、shared_ptr 和 weak_ptr|文件、锁和连接的 RAII 管理|回调捕获、对象销毁和悬空引用','解释节点和订阅者为什么需要保持存活。','退出节点时不泄漏线程或资源。','shared_ptr 不能自动解决循环引用。'),
 topic('cpp-callback','回调、定时器与事件','理解消息到来后代码如何运行。','lambda、std::bind、函数对象与捕获|定时触发与数据驱动触发|回调耗时、阻塞调用和退出条件','给回调计时，发现超过周期的处理。','高频输入不会被一次长任务无限阻塞。','sleep 放进回调可能阻塞其他回调。'),
 topic('cpp-concurrency','多线程与数据竞争','安全共享状态并控制执行时间。','mutex、atomic、条件变量和锁顺序|线程生命周期、队列和生产者消费者|不可变快照与有界缓冲区','用一个线程处理图像，另一个维持目标发送。','负载增大时目标发送仍可监测。','平均周期正常不代表没有长间隔。'),
 topic('python-science','Python 与数据分析','用脚本快速验证数据和算法。','NumPy 数组、广播、矩阵与向量化|Matplotlib 曲线、CSV 与数据清洗|rclpy、虚拟环境及 ROS Python 兼容性','绘制 IMU 三轴数据和采样间隔。','能解释轴、单位和异常样本。','不同 Python 版本可能无法导入 ROS 扩展。'),
 topic('cmake-ament','CMake 与 ament','知道可执行程序如何产生并安装。','find_package、target、链接与头文件|package.xml 声明依赖，CMake 定义构建|install 到 lib/包名以支持 ros2 run','从零建立一个带消息依赖的 C++ 节点。','ros2 pkg executables 能列出程序。','源文件名不一定等于可执行程序名。'),
 topic('colcon-workspace','colcon 与工作空间','用可重复方式构建和加载项目。','src、build、install、log 的职责|packages-select、symlink-install、构建日志|overlay 顺序、同名包遮盖和迁移重建','只重建目标包并在新终端加载正确环境。','运行的程序来自预期 install 路径。','不要把旧架构 CMake 缓存继续复用。'),

examples.quaternions.steps.push(shStep('读取一帧实际姿态，转换成角度',rosCode(pythonCode(`import math,time,rclpy
from sensor_msgs.msg import Imu
from rclpy.qos import qos_profile_sensor_data
rclpy.init(); n=rclpy.create_node('attitude_angles_example'); received=[]
def cb(msg): received.append(msg.orientation)
sub=n.create_subscription(Imu,'/mavros/imu/data',cb,qos_profile_sensor_data)
end=time.monotonic()+8
while not received and time.monotonic()<end: rclpy.spin_once(n,timeout_sec=0.1)
if received:
    q=received[-1]; x,y,z,w=q.x,q.y,q.z,q.w
    norm=math.sqrt(x*x+y*y+z*z+w*w)
    if norm<1e-8: print('Invalid zero quaternion')
    else:
        x,y,z,w=[v/norm for v in (x,y,z,w)]
        roll=math.atan2(2*(w*x+y*z),1-2*(x*x+y*y))
        pitch=math.asin(max(-1,min(1,2*(w*y-z*x))))
        yaw=math.atan2(2*(w*z+x*y),1-2*(y*y+z*z))
        print('roll pitch yaw degrees:',*[round(math.degrees(v),2) for v in (roll,pitch,yaw)])
else: print('NO IMU DATA within 8 seconds')
n.destroy_node(); rclpy.shutdown()`)),'打印一组roll/pitch/yaw角度；对应ROS消息的坐标约定，不能直接当作NED航向角。'));

 'sensor_msgs/msg/MagneticField','sensor_msgs/msg/FluidPressure',
 'sensor_msgs/msg/Temperature','sensor_msgs/msg/BatteryState',
 'mavros_msgs/msg/GPSRAW','mavros_msgs/msg/OpticalFlow',
 'mavros_msgs/msg/OpticalFlowRad','mavros_msgs/msg/VfrHud',

from rclpy.qos import qos_profile_sensor_data
NAMES={0:'HEARTBEAT',1:'SYS_STATUS',24:'GPS_RAW_INT',26:'SCALED_IMU',27:'RAW_IMU',
 29:'SCALED_PRESSURE',30:'ATTITUDE',31:'ATTITUDE_QUATERNION',74:'VFR_HUD',
 100:'OPTICAL_FLOW',105:'HIGHRES_IMU',106:'OPTICAL_FLOW_RAD',116:'SCALED_IMU2',
 124:'GPS2_RAW',129:'SCALED_IMU3',132:'DISTANCE_SENSOR',137:'SCALED_PRESSURE2',
 143:'SCALED_PRESSURE3',147:'BATTERY_STATUS',330:'OBSTACLE_DISTANCE',331:'ODOMETRY'}
rclpy.init(); node=rclpy.create_node('incoming_sensor_mavlink_observer')
counts=collections.Counter(); ranges={}; subscriptions=[]
def callback(msg,topic):
    if msg.framing_status!=Mavlink.FRAMING_OK: return
    counts[(topic,msg.sysid,msg.compid,msg.msgid)]+=1
    if msg.msgid==132 and msg.len<=len(msg.payload64)*8:
        payload=b''.join(int(w).to_bytes(8,'little') for w in msg.payload64)[:msg.len]
        # common.xml DISTANCE_SENSOR 基础字段；MAVLink2的尾部零可被截断。
        boot,minimum,maximum,current,kind,sensor_id,orientation,cov=struct.unpack_from('<IHHHBBBB',payload.ljust(14,bytes([0])))
        ranges[(topic,msg.sysid,msg.compid,sensor_id)]=(kind,orientation,current/100,minimum/100,maximum/100)
try:
    end=time.monotonic()+2
    while time.monotonic()<end: rclpy.spin_once(node,timeout_sec=0.1)
    for topic,types in node.get_topic_names_and_types():
        if types==['mavros_msgs/msg/Mavlink'] and topic.endswith('/mavlink_source') and node.count_publishers(topic):

            subscriptions.append(node.create_subscription(Mavlink,topic,lambda msg,t=topic:callback(msg,t),qos_profile_sensor_data))

        print('No incoming raw topic. Use ros2 topic find mavros_msgs/msg/Mavlink, then check endpoint direction.')
    else:
        end=time.monotonic()+6
        while time.monotonic()<end: rclpy.spin_once(node,timeout_sec=0.1)

 ].forEach(([key,description])=>{list.appendChild(html('dt','',key));list.appendChild(html('dd','',description))});dialog.appendChild(list);
 const mode=btn('',()=>{dialog.close();plainToggle()},'secondary-action');mode.id='input-reader-mode';dialog.appendChild(mode);document.body.appendChild(dialog);
 let searchReturn=null;
 document.addEventListener('keydown',event=>{
  if(event.defaultPrevented||event.isComposing||event.keyCode===229)return;
  if(document.querySelector('dialog[open]'))return;
  if(event.key==='Escape'){
   if(document.body.classList.contains('ios-more-open')){closeMore();$('ios-more').focus();event.preventDefault()}
   else if(document.activeElement===$('search')&&searchReturn?.isConnected){searchReturn.focus();event.preventDefault()}
   return;
  }
  if((event.ctrlKey||event.metaKey)&&!event.altKey&&event.key.toLowerCase()==='k'){
   event.preventDefault();if(document.activeElement!==$('search'))searchReturn=document.activeElement;$('search').focus();$('search').select();return;
  }
  const editing=event.target.closest('input,textarea,select,[contenteditable]:not([contenteditable=false])');
  if(editing||window.getSelection()?.toString())return;
  if(event.ctrlKey&&event.altKey&&!event.metaKey&&!event.shiftKey&&['ArrowLeft','ArrowRight'].includes(event.key)&&['lesson','examples','system'].includes(tab)){
   event.preventDefault();moveStudyStep(event.key==='ArrowRight'?1:-1);
  }
 });
 viewport.tabIndex=0;viewport.setAttribute('aria-label','学习思维导图；方向键平移，加减号缩放，数字0适应窗口');
 viewport.addEventListener('keydown',event=>{
  if(event.target!==viewport||event.ctrlKey||event.metaKey||event.altKey||event.isComposing||window.getSelection()?.toString())return;
  const movement={ArrowLeft:[64,0],ArrowRight:[-64,0],ArrowUp:[0,64],ArrowDown:[0,-64]}[event.key];
  if(movement){event.preventDefault();view.x+=movement[0];view.y+=movement[1];updateView()}
  else if(['+','=','-','0'].includes(event.key)){event.preventDefault();if(event.key==='0')fit();else zoom(event.key==='-'?.8:1.25)}
 });

const autonomyAnswers=new Map();
function renderAutonomyTheory(container,id){
 const t=autonomyTheory[id];if(!t)return;
 const section=html('section','autonomy-theory');section.appendChild(html('div','eyebrow','先理解，再动手'));section.appendChild(html('h3','','用一个日常例子理解'));section.appendChild(html('p','',t.analogy));
 const list=html('ol');t.principle.forEach(point=>list.appendChild(html('li','',point)));section.appendChild(list);section.appendChild(callout('最容易混淆',t.mistake,'pitfall'));section.appendChild(callout('理解到这里就可以继续',t.check,'accept'));const heading=container.querySelector('.sectionhead');if(heading)heading.after(section);else container.prepend(section);
}
function autonomyLab(kind){
 const box=html('section','autonomy-lab');box.appendChild(html('h3','','先动一下数值，看原理怎样变化'));
 const result=html('output','autonomy-lab-result');result.setAttribute('aria-live','polite');const drawing=html('div','autonomy-meter');drawing.setAttribute('aria-hidden','true');const fill=html('span');drawing.appendChild(fill);
 const options=kind==='fasterlio'?{label:'时间偏差（毫秒）',min:0,max:100,value:20,step:5}:kind==='ego'?{label:'完成同一轨迹的时间倍率',min:.5,max:2,value:1,step:.1}:{label:'邻机轨迹已经多久没更新（秒）',min:0,max:1,value:.1,step:.05};
 const label=html('label','',options.label),input=html('input');input.type='range';input.id='autonomy-lab-'+kind;label.htmlFor=input.id;for(const key of ['min','max','value','step'])input[key]=options[key];box.appendChild(label);box.appendChild(input);box.appendChild(drawing);box.appendChild(result);
 function update(){const value=Number(input.value);let text;
  if(kind==='fasterlio')text=`时间差 ${value} ms，假设匀速 2 m/s：仅平移误差约 ${(2*value/1000).toFixed(2)} m。旋转、重力和标定误差未计入。`;
  else if(kind==='ego')text=`时间变为 ${value.toFixed(1)} 倍，速度约 ${(1/value).toFixed(2)} 倍，加速度约 ${(1/value**2).toFixed(2)} 倍，jerk约 ${(1/value**3).toFixed(2)} 倍。路线相同也可能超过运动限制。`;
  else text=`轨迹年龄 ${value.toFixed(2)} s。演示阈值 0.30 s：${value<=.3?'尚未超时，还要检查坐标、轨迹区间与碰撞。':'拒绝继续使用过期轨迹，进入系统定义的异常处理；不能把邻机当作消失。'}`;
  result.textContent=text;input.setAttribute('aria-valuetext',text);fill.style.width=((value-options.min)/(options.max-options.min)*100)+'%';
 }
 input.addEventListener('input',update);update();box.appendChild(html('p','autonomy-note','离线教学模型，不读取设备。数值不代表你的飞机参数，也不能替代完整算法验证。'));return box;
}

 const chain=html('ol','autonomy-chain');p.chain.forEach((text,i)=>{const li=html('li');li.appendChild(html('span','',String(i+1)));li.appendChild(html('strong','',text));chain.appendChild(li)});section.appendChild(chain);
 section.appendChild(html('h3','','先按顺序读这六个主题'));const topics=html('div','autonomy-topics');p.lessonIds.forEach((key,i)=>{const b=btn('',()=>openExample(key),'autonomy-topic');b.appendChild(html('span','',String(i+1).padStart(2,'0')));const copy=html('div');copy.appendChild(html('strong','',plainTopics[key].title));copy.appendChild(html('p','',plainTopics[key].meaning));b.appendChild(copy);topics.appendChild(b)});section.appendChild(topics);section.appendChild(autonomyLab(id));
 const quiz=html('section','autonomy-quiz');quiz.appendChild(html('h3','',p.quiz.question));const feedback=html('p');feedback.setAttribute('aria-live','polite');const choices=html('div','sys-quiz-choices');
 function answer(i){autonomyAnswers.set(id,i);choices.querySelectorAll('button').forEach((b,j)=>{b.setAttribute('aria-pressed',String(i===j));b.classList.toggle('chosen',i===j)});feedback.textContent=(i===p.quiz.answer?'理解正确。':'再想一下职责的边界。')+p.quiz.why}
 p.quiz.choices.forEach((text,i)=>choices.appendChild(btn(text,()=>answer(i),'sys-answer')));quiz.appendChild(choices);quiz.appendChild(feedback);if(autonomyAnswers.has(id))answer(autonomyAnswers.get(id));section.appendChild(quiz);
 const link=btn('看这几个模块怎样配合 →',()=>openSystem(id==='swarm'?'swarm-nav':'lio-nav'),'secondary-action');section.appendChild(link);section.appendChild(html('p','autonomy-note','理解上面内容后，再按下方四关实践。命令在哪里执行、完成标准和失败处理都写在对应主题里。'));container.appendChild(section);
}
