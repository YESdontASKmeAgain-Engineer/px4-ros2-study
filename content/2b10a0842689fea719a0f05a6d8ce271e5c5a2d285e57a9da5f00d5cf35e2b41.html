ex('executors','用一个慢回调观察单线程阻塞',ROS,'只创建计时节点，不连接飞控。',[shStep('运行单线程实验',rosCode(pythonCode(`import time,rclpy

    now=time.monotonic(); print('gap',round(now-state['last'],3),flush=True)
    state.update(last=now,count=state['count']+1)

t1=n.create_timer(0.1,fast); t2=n.create_timer(0.5,slow)

n.destroy_node(); rclpy.shutdown()`)),'多数 gap 接近0.1，慢回调发生后会出现约0.4秒或更长间隔。')],[['换多线程后仍阻塞','还要考虑 Callback Group 互斥以及 Python 运算的 GIL。'],['如何用于工程','把耗时工作放到独立线程/进程，用有界队列交换结果并测实际周期。']],'约2秒后自动退出。');

ex('timesync','测量 IMU 到达间隔与时间戳差值',ROS,'MAVROS 已持续发布 IMU；下面创建只读订阅者，运行最多8秒。',[shStep('收集50个样本',rosCode(pythonCode(`import time,statistics,rclpy

    times.append(time.monotonic())
    ages.append(time.time()-(msg.header.stamp.sec+msg.header.stamp.nanosec*1e-9))

n.destroy_node(); rclpy.shutdown()`)),'约50 Hz时 mean gap 接近0.02秒；wall-minus-header 仅在时间基准一致时才可近似解释为年龄。')],[['差值极大或负数','先确认时间同步和时间基准，不把它直接叫网络延迟。'],['样本数量0','检查发布者与 QoS，程序会超时退出而不会永久挂住。']],'收到50条或8秒后自动退出。');

calc('search','运行一个可复制的四邻域 A*',`import heapq
size=5; start=(0,0); goal=(4,4)

def h(p): return abs(p[0]-goal[0])+abs(p[1]-goal[1])
queue=[(h(start),0,start)]; cost={start:0}; parent={}
while queue:
    _,g,p=heapq.heappop(queue)
    if g!=cost[p]: continue
    if p==goal: break
    for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
        q=(p[0]+dx,p[1]+dy)
        if not (0<=q[0]<size and 0<=q[1]<size) or q in blocked: continue
        new=g+1
        if new<cost.get(q,float('inf')):
            cost[q]=new; parent[q]=p
            heapq.heappush(queue,(new+h(q),new,q))
if goal not in cost: print('No path')
else:
    path=[goal]
    while path[-1]!=start: path.append(parent[path[-1]])
    path.reverse(); print('path=',path); print('length=',cost[goal])`,'输出从(0,0)绕过竖直墙到(4,4)的路径，长度为8步。','这是二维栅格学习示例，未加入机体尺寸和动力学。');

from rclpy.qos import qos_profile_sensor_data
NAMES={0:'HEARTBEAT',1:'SYS_STATUS',24:'GPS_RAW_INT',26:'SCALED_IMU',27:'RAW_IMU',
 29:'SCALED_PRESSURE',30:'ATTITUDE',31:'ATTITUDE_QUATERNION',74:'VFR_HUD',
 100:'OPTICAL_FLOW',105:'HIGHRES_IMU',106:'OPTICAL_FLOW_RAD',116:'SCALED_IMU2',
 124:'GPS2_RAW',129:'SCALED_IMU3',132:'DISTANCE_SENSOR',137:'SCALED_PRESSURE2',
 143:'SCALED_PRESSURE3',147:'BATTERY_STATUS',330:'OBSTACLE_DISTANCE',331:'ODOMETRY'}
rclpy.init(); node=rclpy.create_node('incoming_sensor_mavlink_observer')
counts=collections.Counter(); ranges={}; subscriptions=[]
def callback(msg,topic):
    if msg.framing_status!=Mavlink.FRAMING_OK: return
    counts[(topic,msg.sysid,msg.compid,msg.msgid)]+=1
    if msg.msgid==132 and msg.len<=len(msg.payload64)*8:
        payload=b''.join(int(w).to_bytes(8,'little') for w in msg.payload64)[:msg.len]
        # common.xml DISTANCE_SENSOR 基础字段；MAVLink2的尾部零可被截断。
        boot,minimum,maximum,current,kind,sensor_id,orientation,cov=struct.unpack_from('<IHHHBBBB',payload.ljust(14,bytes([0])))
        ranges[(topic,msg.sysid,msg.compid,sensor_id)]=(kind,orientation,current/100,minimum/100,maximum/100)
try:
    end=time.monotonic()+2
    while time.monotonic()<end: rclpy.spin_once(node,timeout_sec=0.1)
    for topic,types in node.get_topic_names_and_types():
        if types==['mavros_msgs/msg/Mavlink'] and topic.endswith('/mavlink_source') and node.count_publishers(topic):
            print('Incoming candidate:',topic,flush=True)
            subscriptions.append(node.create_subscription(Mavlink,topic,lambda msg,t=topic:callback(msg,t),qos_profile_sensor_data))
    if not subscriptions:
        print('No incoming raw topic. Use ros2 topic find mavros_msgs/msg/Mavlink, then check endpoint direction.')
    else:
        end=time.monotonic()+6
        while time.monotonic()<end: rclpy.spin_once(node,timeout_sec=0.1)
        for (topic,system,component,msgid),count in sorted(counts.items()):
            if msgid in NAMES: print(topic,'sender',system,component,NAMES[msgid],'id',msgid,'count',count)
        for key,value in sorted(ranges.items()):
            print('DISTANCE key=(topic,system,component,sensor_id):',key)
            print('  type,orientation,current_m,min_m,max_m:',value)
        if not counts: print('No valid frames observed in this window; check connection and QoS.')
finally:
    node.destroy_node(); rclpy.shutdown()`;

function commandMeaning(code){const items=[];const add=(part,meaning)=>items.push([part,meaning]);
 if(/source \/opt\/ros\//.test(code))add('source /opt/ros/humble/setup.bash','让当前终端找到ROS 2命令；它不会启动节点。');
 if(/ssh orangepi@/.test(code))add('ssh orangepi@地址','通过网络登录香橙派；登录后的命令在香橙派执行。');
 if(/ros2 topic echo/.test(code))add('ros2 topic echo 话题名','订阅这个频道，收到一条就打印一条；不会替你启动发布者。');
 if(/--once\b/.test(code))add('--once','只接收一条，然后结束。它本身不限制等待多久。');
 if(/--field\s+(\S+)/.test(code))add('--field '+code.match(/--field\s+(\S+)/)[1],'只显示指定字段，减少刷屏内容。');
 if(/--qos-profile sensor_data/.test(code))add('--qos-profile sensor_data','使用适合传感器数据的订阅配置。');
 if(/timeout\b/.test(code))add('timeout','给程序设置最长运行时间，到时停止；超时退出码常为124。');
 if(/ros2 topic info/.test(code))add('ros2 topic info ... -v','看消息类型、发布者和订阅者，-v展开每个端点的细节。');
 if(/ros2 topic (list|find|type)/.test(code))add('topic list / find / type','列频道、按类型找频道，或者查某个频道的消息类型。');
 if(/ros2 topic hz/.test(code))add('ros2 topic hz','统计本机收到消息的频率；受本机负载和通信条件影响。');
 if(/ros2 node/.test(code))add('ros2 node','查看当前能发现的节点；node list不是已安装软件列表。');
 if(/ros2 (run|launch)/.test(code))add('ros2 run / launch','启动程序。保持这个终端运行，按Ctrl+C可结束前台程序。');
 if(/ros2 interface show/.test(code))add('ros2 interface show','查看字段定义、单位注释和常量，不需要该消息正在发布。');
 if(/python3 - <<'PY'/.test(code))add("python3 - <<'PY' ... PY",'把整段代码交给Python执行。连同第一行和最后单独的PY一起复制到Bash。');
 if(/<<'CPP'/.test(code))add("cat ... <<'CPP'",'把中间的C++源码写入文件；复制时保留结尾单独一行的CPP。');
 if(/\bg\+\+\b/.test(code))add('g++','把C++源码编译成程序；后面的路径指定输入和输出。');
 if(/\bgrep\b/.test(code))add('grep','从文字里筛选包含某些关键词的行；筛选为空不等于硬件一定不存在。');
 if(/\|/.test(code))add('|（在Bash命令中）','把左边程序的输出传给右边程序进一步处理；源码中的同一字符可能含义不同。');
 if(/\bpgrep\b/.test(code))add('pgrep -af','按名称查运行进程并显示命令行。没有输出表示没有匹配到。');
 if(/listener /.test(code))add('listener 消息名 数量','在PX4内部查看指定uORB消息；不是Linux的ROS命令。');
 if(/param show /.test(code))add('param show','在PX4控制台只读查看参数；与Linux里的ros2 param属于不同工具。');
 if(/mktemp/.test(code))add('mktemp','创建一个新的临时文件或目录，避免覆盖已有文件。');
 return items.slice(0,8)
}

function sysPort(node,side){const w=166,h=66;return side==='left'?[node.x-w/2,node.y]:side==='right'?[node.x+w/2,node.y]:side==='top'?[node.x,node.y-h/2]:[node.x,node.y+h/2]}
function sysGeometry(edge,cfg){const a=cfg.nodes.find(n=>n.id===edge.from),b=cfg.nodes.find(n=>n.id===edge.to);const horizontal=Math.abs(b.x-a.x)>=Math.abs(b.y-a.y);const start=edge.start||(horizontal?(b.x>a.x?'right':'left'):(b.y>a.y?'bottom':'top'));const end=edge.end||(horizontal?(b.x>a.x?'left':'right'):(b.y>a.y?'top':'bottom'));const points=[sysPort(a,start),...(edge.via||[]),sysPort(b,end)];const d=points.map(([x,y],i)=>(i?'L':'M')+x+','+y).join(' ');let best=0,index=0;for(let i=0;i<points.length-1;i++){const len=Math.hypot(points[i+1][0]-points[i][0],points[i+1][1]-points[i][1]);if(len>best){best=len;index=i}}const label=[(points[index][0]+points[index+1][0])/2,(points[index][1]+points[index+1][1])/2];return {d,label}}
function systemLabelPosition(cfg,edge,width){const {label:[x,y]}=sysGeometry(edge,cfg);const clear=([cx,cy])=>cfg.nodes.every(n=>cx+width/2<n.x-90||cx-width/2>n.x+90||cy+13<n.y-39||cy-13>n.y+39);for(const [dx,dy] of [[0,-22],[0,-57],[0,57],[0,-85],[0,85],[width/2+16,0],[-width/2-16,0]]){const p=[Math.max(width/2+10,Math.min(cfg.width-width/2-10,x+dx)),Math.max(48,Math.min(cfg.height-20,y+dy))];if(clear(p))return p}return [cfg.width/2,cfg.height-20]}
function updateSystemDiagram(){const drawing=$('system-svg');if(!drawing)return;const cfg=systemScenario(systemScene,systemRoute);drawing.replaceChildren();const defs=s('defs',{});for(const [kind,color] of Object.entries({...systemColors,fault:'#c45050'})){const marker=s('marker',{id:'sys-arrow-'+kind,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.appendChild(s('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));defs.appendChild(marker)}drawing.appendChild(defs);
 cfg.zones.forEach((z,i)=>{drawing.appendChild(s('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:14,fill:['#f5f2fa','#eef5fa','#edf7f3','#fff7e9'][i%4],stroke:'#d9e3e9','stroke-width':1}));drawing.appendChild(s('text',{x:z.x+14,y:z.y+26,fill:'#647d8e','font-size':12,'font-weight':600},z.title))});
 const fault=(cfg.faults||[]).find(f=>f.id===systemFault);const activeEdge=systemSelection?.kind==='edge'?systemSelection.id:null,activeNode=systemSelection?.kind==='node'?systemSelection.id:null;
 const relevant=edge=>!systemSelection||edge.id===activeEdge||edge.from===activeNode||edge.to===activeNode;
 for(const edge of cfg.edges){const {d}=sysGeometry(edge,cfg),isFault=fault?.edge===edge.id,color=isFault?'#c45050':systemColors[edge.kind],g=s('g',{class:'sys-connection'+(relevant(edge)?' relevant':' muted'),tabindex:0,role:'button','aria-label':`${systemComponents[edge.from].name} 到 ${systemComponents[edge.to].name}：${edge.label}`,'data-edge':edge.id});
  g.appendChild(s('path',{d,fill:'none',stroke:color,'stroke-width':edge.id===activeEdge?4:2.3,'stroke-linejoin':'round','stroke-dasharray':isFault?'7 5':edge.kind==='observe'?'5 5':'none','marker-end':'url(#sys-arrow-'+(isFault?'fault':edge.kind)+')'}));g.appendChild(s('path',{d,fill:'none',stroke:'transparent','stroke-width':15}));g.appendChild(s('title',{},edge.label+'：'+edge.explain));const activate=()=>selectSystemPart('edge',edge.id);g.addEventListener('click',activate);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}});drawing.appendChild(g)
 }
 cfg.nodes.forEach(n=>{const component=systemComponents[n.id],connected=activeEdge?cfg.edges.find(e=>e.id===activeEdge):null,highlight=n.id===activeNode||connected?.from===n.id||connected?.to===n.id;const g=s('g',{transform:`translate(${n.x-83} ${n.y-33})`,class:'sys-component'+(highlight?' selected':''),tabindex:0,role:'button','aria-label':component.name+'，查看职责输入输出','data-component':n.id});g.appendChild(s('rect',{width:166,height:66,rx:10,fill:highlight?'#e4f2f0':'white',stroke:highlight?'#268d8a':'#bccfd9','stroke-width':highlight?2.4:1.1}));const title=component.name.length>15?component.name.replace('PX4','').trim():component.name;g.appendChild(s('text',{x:83,y:25,'text-anchor':'middle','font-size':title.length>13?11:12.5,fill:'#244d63','font-weight':650},title));g.appendChild(s('text',{x:83,y:46,'text-anchor':'middle','font-size':10,fill:'#74909e'},component.short));const action=()=>selectSystemPart('node',n.id);g.addEventListener('click',action);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}});drawing.appendChild(g)});
 if(activeEdge||fault){const targets=[...new Set([activeEdge,fault?.edge].filter(Boolean))];targets.forEach(id=>{const e=cfg.edges.find(e=>e.id===id);const title=(fault?.edge===id?'假设异常 · ':'')+e.label;const width=Math.min(330,Math.max(100,title.length*11+18)),[x,y]=systemLabelPosition(cfg,e,width);const g=s('g',{class:'sys-edge-label','pointer-events':'none'});g.appendChild(s('rect',{x:x-width/2,y:y-11,width,height:22,rx:5,fill:fault?.edge===id?'#fff0ee':'white',stroke:fault?.edge===id?'#dfa5a0':'#c4dcd9'}));g.appendChild(s('text',{x,y:y+4,'text-anchor':'middle','font-size':11,fill:fault?.edge===id?'#ac514d':'#3c7272'},title));drawing.appendChild(g)})}
}
function updateSystemInspector(){const d=$('system-inspector');if(!d)return;d.replaceChildren();const cfg=systemScenario(systemScene,systemRoute);
 if(!systemSelection){d.appendChild(html('div','eyebrow','这张图怎样看'));d.appendChild(html('h3','','先沿着一条线走'));d.appendChild(html('p','','点击“下一步”逐段阅读。每一步会高亮一段关系，并解释它传什么、为什么需要这一步。'));d.appendChild(html('p','','也可以点击任意方块，查看它在哪里运行、接收什么、输出什么，以及对应的查询例子。'));d.appendChild(html('div','sys-inspector-note','同一块飞控里会并行运行许多模块；此图按职责简化，不表示一个任务阻塞执行完才启动另一个。'));return}
 if(systemSelection.kind==='node'){const n=systemComponents[systemSelection.id];d.appendChild(html('div','eyebrow','组件职责'));d.appendChild(html('h3','',n.name));d.appendChild(html('span','sys-where',n.where));d.appendChild(html('p','',n.role));const dl=html('dl');[['接收什么',n.input],['输出什么',n.output],['怎么检查',n.check],['不要误解',n.mistake]].forEach(([k,v])=>{dl.appendChild(html('dt','',k));dl.appendChild(html('dd','',v))});d.appendChild(dl);d.appendChild(btn('打开对应操作例子 →',()=>openExample(n.topic),'primary-action'));const neighbors=cfg.edges.filter(e=>e.from===systemSelection.id||e.to===systemSelection.id);const group=html('div','sys-neighbors');group.appendChild(html('b','','相关连接'));neighbors.forEach(e=>group.appendChild(btn((e.from===systemSelection.id?'输出 → ':'输入 ← ')+systemComponents[e.from===systemSelection.id?e.to:e.from].name,()=>selectSystemPart('edge',e.id),'text-button')));d.appendChild(group);return}
 const edge=cfg.edges.find(e=>e.id===systemSelection.id),stage=systemStage>=0?cfg.stages[systemStage]:null;d.appendChild(html('div','eyebrow',stage?'讲解 '+(systemStage+1)+' / '+cfg.stages.length:'连接关系'));d.appendChild(html('h3','',stage?.[1]||edge.label));d.appendChild(html('p','sys-endpoints',systemComponents[edge.from].name+' → '+systemComponents[edge.to].name));d.appendChild(html('span','sys-transfer-label',edge.label));d.appendChild(html('p','',edge.explain));if(stage)d.appendChild(html('p','sys-inspector-note',stage[2]));d.appendChild(btn('查看发送方',()=>selectSystemPart('node',edge.from),'secondary-action'));d.appendChild(btn('查看接收方',()=>selectSystemPart('node',edge.to),'secondary-action'));
 const fault=(cfg.faults||[]).find(f=>f.id===systemFault&&f.edge===edge.id);if(fault)d.appendChild(html('p','sys-fault-note','当前假设：'+fault.effect));
}
function updateSystemFault(){const d=$('sys-fault-detail');if(!d)return;d.replaceChildren();const cfg=systemScenario(systemScene,systemRoute),f=(cfg.faults||[]).find(f=>f.id===systemFault);if(!f){d.appendChild(html('p','',cfg.faults?.length?'选择一个假设观察影响。这里只说明可能机制，不代表当前设备有这个故障。':'这张图先看总体分工；切换到IMU、测距、Offboard或视觉场景可查看具体故障。'));return}d.appendChild(html('p','sys-fault-note',f.effect));d.appendChild(html('p','','先检查：'+f.check));d.appendChild(btn('去看检查命令',()=>openExample(f.topic),'secondary-action'))}
function updateSystemQuiz(){const cfg=systemScenario(systemScene,systemRoute),answer=systemAnswers.get(systemScene+':'+systemRoute),result=$('sys-quiz-result');if(!result)return;document.querySelectorAll('.sys-answer').forEach(b=>{const i=Number(b.dataset.answer);b.classList.toggle('chosen',i===answer);b.setAttribute('aria-pressed',String(i===answer))});result.textContent=answer===undefined?'选择一个答案，看看是否真正理解这条关系。':(answer===cfg.quiz.answer?'理解正确。':'再看一下数据与职责的区别。')+cfg.quiz.why;result.classList.toggle('answered',answer!==undefined)}

bootLearning();
